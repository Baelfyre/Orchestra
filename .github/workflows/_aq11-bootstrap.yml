name: AQ11 Bootstrap

on:
  push:
    branches:
      - feat/aq11-remediation-effectiveness-pilot-20260911
    paths:
      - 'scripts/_aq11_bootstrap.py'
      - '.github/workflows/_aq11-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AQ11 branch
        uses: actions/checkout@v4
        with:
          ref: feat/aq11-remediation-effectiveness-pilot-20260911
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused runtime dependencies
        run: python -m pip install pytest 'jsonschema[format]>=4.21,<5'
      - name: Apply packaging-only bootstrap repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/_aq11_bootstrap.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "    for helper in HELPERS:\n"
          end_marker = '\n\n\nif __name__ == "__main__":'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_tail = (
              "    for helper in HELPERS:\n"
              "        if helper.exists():\n"
              "            helper.unlink()\n"
              "\n"
              "    helper_paths = [str(path.relative_to(ROOT)) for path in HELPERS]\n"
              "    run(\"git\", \"add\", \"--\", *helper_paths)\n"
              "    run(\"git\", \"commit\", \"-m\", \"chore(aq11): retire bounded bootstrap helpers\")\n"
              "\n"
              "    run(\"git\", \"add\", \"-A\")\n"
              "    changed = set(out(\"git\", \"diff\", \"--cached\", \"--name-only\").splitlines())\n"
              "    if changed != set(INVENTORY):\n"
              "        raise RuntimeError(f\"AQ11 packaging drift: {sorted(changed)}\")\n"
              "    run(\"git\", \"diff\", \"--cached\", \"--check\")\n"
              "    run(\"git\", \"commit\", \"-m\", \"feat(aq11): add controlled remediation effectiveness pilot\")\n"
              "\n"
              "    net_changed = set(out(\"git\", \"diff\", \"--name-only\", BASE, \"HEAD\").splitlines())\n"
              "    if net_changed != set(INVENTORY):\n"
              "        raise RuntimeError(f\"AQ11 net packaging drift: {sorted(net_changed)}\")\n"
              "\n"
              "    print(\"AQ11_FOCUSED_BOOTSTRAP=PASS\")\n"
              "    print(\"AQ11_HEAD=\" + out(\"git\", \"rev-parse\", \"HEAD\"))\n"
              "    print(\"AQ11_TREE=\" + out(\"git\", \"rev-parse\", \"HEAD^{tree}\"))\n"
              "    run(\"git\", \"push\", \"origin\", f\"HEAD:{BRANCH}\")\n"
          )
          path.write_text(text[:start] + new_tail + text[end:], encoding="utf-8")
          PY
      - name: Materialize and qualify exact AQ11 inventory
        run: python -B scripts/_aq11_bootstrap.py
