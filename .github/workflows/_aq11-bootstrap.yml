name: AQ11 Bootstrap

on:
  push:
    branches:
      - feat/aq11-remediation-effectiveness-pilot-20260911
    paths:
      - 'scripts/_aq11_bootstrap.py'
      - '.github/workflows/_aq11-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AQ11 branch
        uses: actions/checkout@v4
        with:
          ref: feat/aq11-remediation-effectiveness-pilot-20260911
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused runtime dependencies
        run: python -m pip install pytest 'jsonschema[format]>=4.21,<5'
      - name: Apply packaging-only bootstrap repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/_aq11_bootstrap.py")
          text = path.read_text(encoding="utf-8")
          old = '''    for helper in HELPERS:
              if helper.exists():
                  helper.unlink()
          run("git", "add", "-A")
          changed = set(out("git", "diff", "--cached", "--name-only").splitlines())
          if changed != set(INVENTORY):
              raise RuntimeError(f"AQ11 packaging drift: {sorted(changed)}")
          run("git", "diff", "--cached", "--check")
          run("git", "commit", "-m", "feat(aq11): add controlled remediation effectiveness pilot")
          print("AQ11_FOCUSED_BOOTSTRAP=PASS")
          print("AQ11_HEAD=" + out("git", "rev-parse", "HEAD"))
          print("AQ11_TREE=" + out("git", "rev-parse", "HEAD^{tree}"))
          run("git", "push", "origin", f"HEAD:{BRANCH}")
          '''
          new = '''    for helper in HELPERS:
              if helper.exists():
                  helper.unlink()

          helper_paths = [str(path.relative_to(ROOT)) for path in HELPERS]
          run("git", "add", "--", *helper_paths)
          run("git", "commit", "-m", "chore(aq11): retire bounded bootstrap helpers")

          run("git", "add", "-A")
          changed = set(out("git", "diff", "--cached", "--name-only").splitlines())
          if changed != set(INVENTORY):
              raise RuntimeError(f"AQ11 packaging drift: {sorted(changed)}")
          run("git", "diff", "--cached", "--check")
          run("git", "commit", "-m", "feat(aq11): add controlled remediation effectiveness pilot")

          net_changed = set(out("git", "diff", "--name-only", BASE, "HEAD").splitlines())
          if net_changed != set(INVENTORY):
              raise RuntimeError(f"AQ11 net packaging drift: {sorted(net_changed)}")

          print("AQ11_FOCUSED_BOOTSTRAP=PASS")
          print("AQ11_HEAD=" + out("git", "rev-parse", "HEAD"))
          print("AQ11_TREE=" + out("git", "rev-parse", "HEAD^{tree}"))
          run("git", "push", "origin", f"HEAD:{BRANCH}")
          '''
          if old not in text:
              raise SystemExit("AQ11 packaging repair anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Materialize and qualify exact AQ11 inventory
        run: python -B scripts/_aq11_bootstrap.py
