name: Temporary O7.7 changelog update

on:
  push:
    branches:
      - feat/o7-7-joint-conformance-20260828
    paths:
      - ".github/workflows/_o7-7-changelog-tmp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/o7-7-joint-conformance-20260828
      - name: Add focused O7.7 changelog entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          anchor = "## Post-v1.7 O7.1-O7.6 Registry R7 direct consumption runtime\n"
          entry = '''## Post-v1.7 O7.7 trusted Registry joint conformance\n\n- Added an executable cross-repository O7.7 conformance gate against immutable `registry-v0.4.0`, exact release source `488c979b37dd84d8645fd8e6c288d297375c4e5b`, release-manifest SHA-256 `040d6576cf10e9f7e3a9a051792869541c1d33b7af3c665fad8eecb939c7baaa`, and bundle SHA-256 `e0457a75837d169d7bb8a7da14d8f4141d35a691952ff8f8978ef793e3cf92d3`.\n- Bound joint conformance to the validated post-release Registry runtime at commit `4926a3b5f48122dd45f3c8e83a12b8d071dd5387`, tree `01be27bde90f6faa59ab74d60ba13af480c11b1d`, including trusted direct-JSON identity verification without changing the immutable v0.4.0 release.\n- Verified the same privacy `EVIDENCE` query through trusted direct JSON, verified indexed gateway, and read-only MCP transport with semantic parity across records, source IDs, obligation IDs, query digest, freshness evidence, and normalized `ComplianceQueryReceipt` identity.\n- Preserved Registry canonical JSON as authority, retained O1-O6 fallback and fail-closed semantic/integrity behavior, and prohibited authority expansion and model-authored integrity repair.\n- The R7.9 benchmark did not establish token-efficiency benefit, so no token-efficiency claim is introduced. O7.7 conformance evidence does not itself authorize an Orchestra release, deployment, policy activation, installed-integration refresh, or any other protected action.\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("expected exactly one O7.1-O7.6 changelog anchor")
          if "## Post-v1.7 O7.7 trusted Registry joint conformance" in text:
              raise SystemExit("O7.7 changelog entry already exists")
          path.write_text(text.replace(anchor, entry + anchor), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(o7): record trusted joint conformance"
          git push origin HEAD:feat/o7-7-joint-conformance-20260828
