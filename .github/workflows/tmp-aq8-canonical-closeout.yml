name: Temporary AQ8 canonical closeout reconciliation

on:
  push:
    branches:
      - docs/aq8-canonical-closeout-20260910

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical AQ8 lifecycle projections
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readme = Path('README.json')
          text = readme.read_text(encoding='utf-8')

          old_header = '''    "adaptive_assurance_aq8_high_risk_packs": {\n      "status": "IMPLEMENTATION_CANDIDATE",'''
          new_header = '''    "adaptive_assurance_aq8_high_risk_packs": {\n      "status": "AQ8_COMPLETE_CANONICAL_VERIFIED",'''
          assert text.count(old_header) == 1
          text = text.replace(old_header, new_header, 1)

          old_note = '''      "authority_note": "AQ8 results are evidence-only and non-authorizing. Arbiter remains transition owner; the source candidate is not signed-materialized, merged, or reconciled to Padayon."'''
          new_note = '''      "canonical_source_pr": 879,\n      "qualified_source_head": "c0d30070dfc7655907a87964caffd005078f8896",\n      "signed_materialization_pr": 883,\n      "signed_materialization_commit": "e124efb4fdf9a0e5a69815662c53acb0c1829265",\n      "canonical_pr": 884,\n      "canonical_sha": "1ef3faf459c9c64ed3ce7b316b44e3d7d793bf82",\n      "canonical_tree": "f5fa432d154651152061267b23c678d3e389338c",\n      "canonical_signature": "VERIFIED_VALID",\n      "post_merge_validation": "PASS",\n      "authority_note": "AQ8 results remain evidence-only and non-authorizing after canonicalization. Arbiter remains transition owner; canonical completion does not grant release, deployment, provider, production, protected-policy, or AQ9 authority."'''
          assert text.count(old_note) == 1
          text = text.replace(old_note, new_note, 1)

          old_maturity = '    "adaptive_assurance_aq8": "AQ8_SOURCE_CANDIDATE_IMPLEMENTATION_ONLY"'
          new_maturity = '    "adaptive_assurance_aq8": "AQ8_COMPLETE_CANONICAL_VERIFIED"'
          assert text.count(old_maturity) == 1
          text = text.replace(old_maturity, new_maturity, 1)
          readme.write_text(text, encoding='utf-8', newline='\n')
          json.loads(text)

          changelog = Path('CHANGELOG.md')
          ctext = changelog.read_text(encoding='utf-8')
          old_bullet = '- Keeps AQ8 source-only: no signed materialization, canonical merge, Padayon reconciliation, provider activation, production action, or AQ9+ authority.'
          new_bullets = '- Canonicalizes the qualified AQ8 Run N+2 through source PR #879, signed materialization PR #883, and canonical PR #884 at commit `1ef3faf459c9c64ed3ce7b316b44e3d7d793bf82` and tree `f5fa432d154651152061267b23c678d3e389338c`, preserving source/materialized/canonical tree identity.\n- Confirms canonical post-merge Governance, validate/runtime, Required Analysis, cross-platform, and CodeQL validation PASS while leaving AQ9 unauthorized and release, deployment, provider, production, and protected-policy authority unchanged.'
          assert ctext.count(old_bullet) == 1
          ctext = ctext.replace(old_bullet, new_bullets, 1)
          changelog.write_text(ctext, encoding='utf-8', newline='\n')

          doc = Path('docs/architecture/ADAPTIVE_ASSURANCE_AQ8.md')
          dtext = doc.read_text(encoding='utf-8')
          marker = '## Canonical closeout\n'
          assert marker not in dtext
          closeout = '''\n\n## Canonical closeout\n\nAQ-8 completed its governed Run N+2 promotion without authority expansion.\n\n- Qualified source PR: #879 at `c0d30070dfc7655907a87964caffd005078f8896`\n- Qualified source tree: `f5fa432d154651152061267b23c678d3e389338c`\n- Signed materialization PR: #883\n- Signed carrier commit: `e124efb4fdf9a0e5a69815662c53acb0c1829265`\n- Canonical PR: #884\n- Canonical commit: `1ef3faf459c9c64ed3ce7b316b44e3d7d793bf82`\n- Canonical tree: `f5fa432d154651152061267b23c678d3e389338c`\n- Canonical signature: verified / valid\n- Post-merge validation: PASS\n\nThe qualified source tree, signed materialization tree, and canonical tree are\nidentical. AQ-8 remains evidence-only and non-authorizing. AQ9 is not admitted\nby this closeout. Release, deployment, provider, production, protected-policy,\nand other protected-action authority remain independently governed.\n'''
          doc.write_text(dtext.rstrip() + closeout, encoding='utf-8', newline='\n')

          assert 'AQ8_SOURCE_CANDIDATE_IMPLEMENTATION_ONLY' not in readme.read_text(encoding='utf-8')
          assert 'source candidate is not signed-materialized' not in readme.read_text(encoding='utf-8')
          PY
          git diff --check
      - name: Remove temporary workflow and commit reconciliation
        shell: bash
        run: |
          git rm .github/workflows/tmp-aq8-canonical-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.json CHANGELOG.md docs/architecture/ADAPTIVE_ASSURANCE_AQ8.md
          git commit -m 'docs(aq8): reconcile canonical closeout state'
          git push origin HEAD:docs/aq8-canonical-closeout-20260910
