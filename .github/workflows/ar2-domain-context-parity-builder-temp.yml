# Second push intentionally triggers this self-removing bounded parity builder.
name: AR2 Domain Context Parity Builder Temp

on:
  push:
    branches:
      - refactor/ar2-domain-context-20260902

permissions:
  contents: write

jobs:
  patch-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ar2-domain-context-20260902
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply bounded documentation parity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readme = Path('README.json')
          text = readme.read_text(encoding='utf-8')

          old_human = '      "human_sources": ["docs/project/ORCHESTRA_RUNTIME_ARCHITECTURE_REFOUNDATION.md", "docs/architecture/README.md"],\n'
          new_human = '      "human_sources": ["docs/project/ORCHESTRA_RUNTIME_ARCHITECTURE_REFOUNDATION.md", "docs/project/ORCHESTRA_AR2_DOMAIN_CONTEXT_EXTRACTION.md", "docs/architecture/README.md"],\n'
          if new_human not in text:
              if old_human not in text:
                  raise SystemExit('README human_sources anchor not found')
              text = text.replace(old_human, new_human, 1)

          anchor = '      "shared_canonicalization_validation_surface": "tests/runtime/test_shared_canonicalization.py",\n'
          addition = (
              '      "context_domain_surface": "orchestra_runtime/domain/context",\n'
              '      "context_domain_state_surface": "orchestra_runtime/domain/context/state.py",\n'
              '      "context_domain_compiler_surface": "orchestra_runtime/domain/context/compiler.py",\n'
              '      "context_legacy_compatibility_surface": "orchestra_runtime/context_state.py",\n'
              '      "context_domain_validation_surface": "tests/runtime/test_domain_context.py",\n'
          )
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('README shared canonicalization anchor not found')
              text = text.replace(anchor, anchor + addition, 1)

          json.loads(text)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          ch = changelog.read_text(encoding='utf-8')
          heading = '## Post-v1.7 runtime architecture AR-2 domain context extraction candidate\n'
          if heading not in ch:
              section = '''## Post-v1.7 runtime architecture AR-2 domain context extraction candidate

- Establishes `orchestra_runtime.domain.context` as the inward-only owner of `CurrentProjectState`, `ContinuityEvent`, and deterministic `compile_context` semantics.
- Preserves legacy `orchestra_runtime.context_state` imports by re-exposing the same canonical domain symbols while deliberately retaining JSONL filesystem persistence and Markdown projection on the legacy surface for later infrastructure/presentation extraction.
- Adds direct compatibility and domain-context regression coverage plus detailed extraction documentation and `README.json` machine-discovery parity.
- Does not move communication-budget presentation dependencies, clock/entropy-backed correlation generation, provider/MCP behavior, public entrypoints, release/deployment authority, or start AR-3.

'''
              marker = '# Changelog\n\n'
              if marker not in ch:
                  raise SystemExit('CHANGELOG heading anchor not found')
              ch = ch.replace(marker, marker + section, 1)
              changelog.write_text(ch, encoding='utf-8')
          PY

      - name: Validate bounded parity patch
        shell: bash
        run: |
          python -m json.tool README.json >/dev/null
          git diff --check
          git diff -- README.json CHANGELOG.md

      - name: Commit parity and remove temporary builder
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ar2-domain-context-parity-builder-temp.yml
          git add README.json CHANGELOG.md
          git commit -m 'docs(ar2): align domain context discovery parity'
          git push origin HEAD:refactor/ar2-domain-context-20260902
