name: O7 README Machine Parity Helper

on:
  push:
    branches:
      - feat/o7-r7-direct-consumption-20260828

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/o7-r7-direct-consumption-20260828
          fetch-depth: 0
      - name: Apply asserted O7 machine parity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.json")
          text = path.read_text(encoding="utf-8")
          if '"status": "O7_1_O7_6_IMPLEMENTED_PENDING_CANONICALIZATION"' in text:
              print("README O7 machine parity already present")
              raise SystemExit(0)

          replacements = [
              (
                  '    "registry_query_optimization_o7": {\n      "status": "APPROVED_PLANNED_NOT_IMPLEMENTED",',
                  '    "registry_query_optimization_o7": {\n      "status": "O7_1_O7_6_IMPLEMENTED_PENDING_CANONICALIZATION",',
                  "capability status",
              ),
              (
                  '      "human_sources": ["docs/architecture/REGISTRY_QUERY_OPTIMIZATION_O7.md"],\n      "implementation_order": "AFTER_ORCHESTRA_V1_7_0_AND_AFTER_STABLE_REGISTRY_R7_CONTRACT",',
                  '      "runtime_surface": "orchestra_runtime/registry_o7.py",\n      "machine_sources": ["docs/architecture/contracts/registry-o7-runtime-state.v1.json"],\n      "human_sources": ["docs/architecture/REGISTRY_QUERY_OPTIMIZATION_O7.md"],\n      "validation_surfaces": ["tests/runtime/test_registry_o7.py", "tests/runtime/test_registry_o7_runtime_state.py"],\n      "registry_r7_1_r7_6_canonical": {"repository": "Baelfyre/Orchestra-Compliance-Registry", "sha": "155c21ab54f704d876ae4a0c2d995f5591f13930", "tree": "ea99fce806a455c4c1e2c912277c44d3595f54d8", "surface_status": "IMPLEMENTED_STABLE_DIRECT_SURFACE_R7_1_R7_6"},\n      "implementation_order": "O7_1_O7_6_IMPLEMENTED_AFTER_STABLE_REGISTRY_R7_SURFACE",',
                  "machine discovery",
              ),
              (
                  '    "registry_query_optimization_o7": "APPROVED_PLANNED_NOT_IMPLEMENTED",',
                  '    "registry_query_optimization_o7": "O7_1_O7_6_IMPLEMENTED_PENDING_CANONICALIZATION_O7_7_BLOCKED",',
                  "maturity",
              ),
              (
                  '    "treat_registry_query_o7_as_planned_not_implemented_until_canonical_runtime_evidence_exists": true,',
                  '    "treat_registry_o7_1_o7_6_as_implemented_only_when_runtime_state_and_canonical_registry_dependency_are_verified": true,',
                  "review guidance",
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"README parity assertion failed for {label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit machine parity only
        run: |
          if git diff --quiet -- README.json; then
            echo "No README parity change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.json
          git diff --cached --check
          git commit -m "docs(o7): add machine discovery parity"
          git push origin HEAD:feat/o7-r7-direct-consumption-20260828
