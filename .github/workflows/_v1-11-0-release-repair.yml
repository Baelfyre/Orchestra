name: Orchestra v1.11.0 Release Preparation Repair

on:
  push:
    branches:
      - release/v1.11.0-adaptive-assurance-20260911
    paths:
      - tools/_v1_11_0_release_repair.py
      - .github/workflows/_v1-11-0-release-repair.yml

permissions:
  contents: write

jobs:
  repair-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.11.0-adaptive-assurance-20260911
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest pytest-cov jsonschema hypothesis
      - name: Repair transport and materialize candidate
        run: python tools/_v1_11_0_release_repair.py
