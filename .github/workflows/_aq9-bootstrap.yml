name: aq9-bootstrap

on:
  push:
    branches:
      - feat/aq9-deep-assurance-20260911

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AQ9 branch
        uses: actions/checkout@v7
        with:
          ref: feat/aq9-deep-assurance-20260911
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Materialize exact AQ9 inventory
        run: python scripts/_aq9_bootstrap.py

      - name: Align README machine-contract indexing
        run: python scripts/_aq9_readme_alignment_fix.py

      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest jsonschema

      - name: Validate AQ9 contract and parity
        run: python scripts/validation/validate_aq9.py

      - name: Run AQ9 focused regressions
        run: python -m pytest -q tests/runtime/test_adaptive_assurance_aq9.py tests/behavior/test_protected_aq8_assurance_scope_policy.py

      - name: Compile AQ9 Python surfaces
        run: python -m compileall -q scripts/validation/validate_aq9.py tests/runtime/test_adaptive_assurance_aq9.py

      - name: Check diff hygiene
        run: git diff --check

      - name: Finalize exact nine-path candidate
        shell: bash
        run: |
          set -euo pipefail
          base=1e1a0f18ebb144bed76bc2ec617d3a3913b1c041
          rm .github/workflows/_aq9-bootstrap.yml scripts/_aq9_bootstrap.py scripts/_aq9_readme_alignment_fix.py
          expected="$(printf '%s\n' CHANGELOG.md README.json cosmic-ray.toml docs/architecture/ADAPTIVE_ASSURANCE_AQ9.md machine/adaptive/aq9-deep-assurance.v1.json machine/schemas/aq9-deep-assurance.v1.schema.json scripts/validation/validate_aq9.py tests/behavior/run_tests.py tests/runtime/test_adaptive_assurance_aq9.py | sort)"
          actual="$(git diff --name-only "$base" -- | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "AQ9_FINAL_SCOPE=FAIL"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          git diff --check "$base" --
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(aq9): deepen deterministic assurance"
          git push origin HEAD:feat/aq9-deep-assurance-20260911
