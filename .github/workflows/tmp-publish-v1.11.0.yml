name: Publish Orchestra v1.11.0

on:
  push:
    branches:
      - "ops/publish-v1.11.0-20260911"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 72c2884a66bb0e0d0ff1e070e7cc1feccd968e35
      TAG: v1.11.0
      RELEASE_TITLE: Orchestra v1.11.0 — Adaptive Assurance and Governance Hardening
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable publication preconditions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "$TARGET_SHA"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          echo "PUBLICATION_PRECONDITIONS=PASS"

      - name: Build release notes
        shell: bash
        run: |
          cat > /tmp/v1.11.0-release-notes.md <<'EOF'
          Orchestra v1.11.0 packages the complete governed development delta after v1.10.0 through the AQ14 canonical state.

          ## Highlights

          - Completes the ADAPT-QA AQ1–AQ14 assurance campaign, from normative assurance doctrine and deterministic risk profiling through deep assurance, adversarial self-test, staged non-production evaluation, and final effectiveness qualification.
          - Adds PRAI post-run assurance with candidate/source/tree binding and fail-closed evidence handling.
          - Adds Protected Governance Escalation so autonomous execution terminates when progress would require changing protected policy that blocks the same candidate.
          - Adds Covenant cross-governance synthesis while preserving specialist and Arbiter authority boundaries.
          - Hardens whitelist mutation as human-only protected policy.
          - Adds tree-attested promotion assurance, allowing exact qualified-tree evidence reuse only through verified signed identical-tree carriers.
          - Adds deterministic exact-set RELEASE_PACKAGING assurance classification with fail-closed mixed/unknown scope behavior.
          - Includes the AQ7 tenant-administration domain/application/persistence/HTTP-shaped adapter parity reference slice.
          - Aligns supported package, plugin, host-update, and release-version surfaces to 1.11.0.

          ## Governance boundaries retained

          - AQ15 is not defined or registered and is not included in this release.
          - AR-3 through AR-9 remain deferred until after v1.11.0 publication and reconciliation.
          - CritiQual CUD10 remains held and outside this release authority.
          - This release does not grant provider, telemetry, production, deployment, whitelist, or protected-policy mutation authority.

          ## Qualification

          The exact release tree passed the complete protected source qualification matrix, GitHub-signed identical-tree materialization, tree-attested canonical promotion, and canonical post-merge validation including dynamic CodeQL.

          Canonical release commit: `72c2884a66bb0e0d0ff1e070e7cc1feccd968e35`
          Canonical release tree: `e4072cff4de83efa1c1d2d495aa5c186a2469db4`
          EOF

      - name: Publish exact canonical release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/v1.11.0-release-notes.md \
            --latest

      - name: Verify published tag and release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$TAG_SHA" = "$TARGET_SHA"
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /tmp/release.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/release.json', encoding='utf-8'))
          expected = os.environ['TARGET_SHA']
          assert data['tag_name'] == os.environ['TAG']
          assert data['draft'] is False
          assert data['prerelease'] is False
          target = data.get('target_commitish')
          assert target == expected, (target, expected)
          print('RELEASE_ID=' + str(data['id']))
          print('PUBLISHED_AT=' + str(data.get('published_at')))
          print('IMMUTABLE=' + str(data.get('immutable')))
          print('PUBLICATION_READBACK=PASS')
          PY

      - name: Self-retire publication workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-publish-v1.11.0.yml
          git commit -m "chore(release): retire v1.11.0 publication workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
