name: CUIR-4 UIX9 freeze-preserving remediation v3

on:
  push:
    branches:
      - feat/cloak-cuir4-pattern-intelligence

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloak-cuir4-pattern-intelligence
          fetch-depth: 0
      - name: Restore frozen core guidance and validate adjacent retrieval
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- skills/cloak/SKILL.md adapters/codex/skills/cloak/SKILL.md
          git diff --exit-code origin/main -- skills/cloak/SKILL.md adapters/codex/skills/cloak/SKILL.md
          python - <<'PY'
          from pathlib import Path
          import re

          test = Path('tests/runtime/test_cloak_ui_reference_corpus_cuir4.py')
          text = test.read_text(encoding='utf-8')
          pattern = r'def test_skill_progressive_disclosure_and_adapter_parity\(\):.*?(?=def test_readme_machine_projection_tracks_candidate_without_granting_cuir5\(\):)'
          replacement = "\n".join([
              "def test_adjacent_progressive_disclosure_guide_preserves_frozen_core_skill():",
              "    assert GUIDE.read_text(encoding=\"utf-8\") == CODEX_GUIDE.read_text(encoding=\"utf-8\")",
              "    guide = GUIDE.read_text(encoding=\"utf-8\")",
              "    assert \"Ponytail\" in guide",
              "    assert \"do not copy source expression or assets\" in guide",
              "    index = _json(INDEX)",
              "    assert index[\"retrieval_policy\"][\"mode\"] == \"PROGRESSIVE_DISCLOSURE\"",
              "    assert index[\"retrieval_policy\"][\"default_catalog_injection\"] is False",
              "    manifest = _json(ROOT / \"machine/ui/uix9-live-guidance-manifest.v1.json\")",
              "    cloak = next(item for item in manifest[\"materials\"] if item[\"path\"] == \"skills/cloak/SKILL.md\")",
              "    import hashlib",
              "    assert hashlib.sha256((ROOT / \"skills/cloak/SKILL.md\").read_bytes()).hexdigest() == cloak[\"canonical_blob_digest\"]",
              "",
              "",
          ])
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              pattern = r'def test_progressive_disclosure_guide_and_adapter_parity_preserve_frozen_core_skill\(\):.*?(?=def test_readme_machine_projection_tracks_candidate_without_granting_cuir5\(\):)'
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one CUIR-4 disclosure test block, replaced {count}')
          test.write_text(new_text, encoding='utf-8')

          doc = Path('docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR4_INTEGRATION.md')
          d = doc.read_text(encoding='utf-8')
          note = 'The integration is deliberately adjacent to the frozen UIX-9 treatment surface. `skills/cloak/SKILL.md` remains byte-identical to the canonical UIX-9 guidance freeze so historical proof identities remain reproducible. CUIR-4 is exposed through machine discovery, the bounded helper, and an explicitly loaded Cloak guide rather than silently changing that frozen treatment.\n\n'
          if note not in d:
              needle = 'The integration has three surfaces:\n\n'
              if needle not in d:
                  raise SystemExit('CUIR-4 document insertion point missing')
              d = d.replace(needle, note + needle, 1)
              doc.write_text(d, encoding='utf-8')

          guide = Path('skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md')
          g = guide.read_text(encoding='utf-8')
          note = 'This guide is an adjacent progressive-disclosure surface and intentionally does not alter the frozen core `SKILL.md` used by the historical UIX-9 proof protocol. Load it explicitly through the CUIR-4 machine-discovery/retrieval path.'
          if note not in g:
              needle = 'Use this guide only when the active task needs design-pattern selection or comparison. Do not load the full CUIR corpus by default.\n'
              if needle not in g:
                  raise SystemExit('CUIR-4 guide insertion point missing')
              g = g.replace(needle, needle + '\n' + note + '\n', 1)
              guide.write_text(g, encoding='utf-8')
          Path('adapters/codex/skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md').write_text(g, encoding='utf-8')
          PY
          python -m pip install pytest
          git diff --check
          python -m pytest tests/runtime/test_cloak_ui_reference_corpus_cuir4.py tests/runtime/test_uix9_live_metric_evaluator_v2.py tests/runtime/test_uix9_live_proof_protocol.py tests/runtime/test_uix9c_v3_stdin_transport.py -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/cloak/SKILL.md adapters/codex/skills/cloak/SKILL.md skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md adapters/codex/skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR4_INTEGRATION.md tests/runtime/test_cloak_ui_reference_corpus_cuir4.py
          git commit -m "fix(cuir4): preserve frozen UIX9 guidance"
          git push origin HEAD:feat/cloak-cuir4-pattern-intelligence
