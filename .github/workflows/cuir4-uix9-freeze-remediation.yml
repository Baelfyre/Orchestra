name: CUIR-4 UIX9 freeze-preserving remediation

on:
  push:
    branches:
      - feat/cloak-cuir4-pattern-intelligence

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloak-cuir4-pattern-intelligence
          fetch-depth: 0
      - name: Preserve frozen UIX9 guidance while retaining CUIR-4 retrieval
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q 'preserve frozen UIX9 guidance'; then
            echo CUIR4_UIX9_REMEDIATION=ALREADY_APPLIED
            exit 0
          fi
          git fetch origin main
          git checkout origin/main -- skills/cloak/SKILL.md adapters/codex/skills/cloak/SKILL.md
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/runtime/test_cloak_ui_reference_corpus_cuir4.py')
          text = test.read_text(encoding='utf-8')
          old = '''def test_skill_progressive_disclosure_and_adapter_parity():
    source_skill = (ROOT / "skills/cloak/SKILL.md").read_text(encoding="utf-8")
    codex_skill = (ROOT / "adapters/codex/skills/cloak/SKILL.md").read_text(encoding="utf-8")
    marker = "Load `CUIR_PATTERN_INTELLIGENCE_GUIDE.md` only when"
    assert marker in source_skill
    assert marker in codex_skill
    assert GUIDE.read_text(encoding="utf-8") == CODEX_GUIDE.read_text(encoding="utf-8")
    assert "Ponytail" in GUIDE.read_text(encoding="utf-8")
    assert "do not copy source expression or assets" in GUIDE.read_text(encoding="utf-8")
'''
          new = '''def test_progressive_disclosure_guide_and_adapter_parity_preserve_frozen_core_skill():
    source_skill = (ROOT / "skills/cloak/SKILL.md").read_bytes()
    codex_skill = (ROOT / "adapters/codex/skills/cloak/SKILL.md").read_bytes()
    assert source_skill == codex_skill
    assert GUIDE.read_text(encoding="utf-8") == CODEX_GUIDE.read_text(encoding="utf-8")
    guide = GUIDE.read_text(encoding="utf-8")
    assert "Ponytail" in guide
    assert "do not copy source expression or assets" in guide
    index = _json(INDEX)
    assert index["retrieval_policy"]["mode"] == "PROGRESSIVE_DISCLOSURE"
    assert index["retrieval_policy"]["default_catalog_injection"] is False
'''
          if old not in text:
              raise SystemExit('Expected CUIR-4 skill test block not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          doc = Path('docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR4_INTEGRATION.md')
          d = doc.read_text(encoding='utf-8')
          needle = 'The integration has three surfaces:\n\n'
          replacement = '''The integration is deliberately adjacent to the frozen UIX-9 treatment surface. `skills/cloak/SKILL.md` remains byte-identical to the canonical UIX-9 guidance freeze so historical proof identities remain reproducible. CUIR-4 is exposed through machine discovery, the bounded helper, and an explicitly loaded Cloak guide rather than silently changing that frozen treatment.\n\nThe integration has three surfaces:\n\n'''
          if needle not in d:
              raise SystemExit('CUIR-4 document insertion point not found')
          doc.write_text(d.replace(needle, replacement, 1), encoding='utf-8')

          guide = Path('skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md')
          g = guide.read_text(encoding='utf-8')
          needle = 'Use this guide only when the active task needs design-pattern selection or comparison. Do not load the full CUIR corpus by default.\n'
          replacement = needle + '\nThis guide is an adjacent progressive-disclosure surface and intentionally does not alter the frozen core `SKILL.md` used by the historical UIX-9 proof protocol. Load it explicitly through the CUIR-4 machine-discovery/retrieval path.\n'
          if needle not in g:
              raise SystemExit('CUIR-4 guide insertion point not found')
          g = g.replace(needle, replacement, 1)
          guide.write_text(g, encoding='utf-8')
          Path('adapters/codex/skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md').write_text(g, encoding='utf-8')
          PY
          python -m pip install pytest
          git diff --check
          python -m pytest tests/runtime/test_cloak_ui_reference_corpus_cuir4.py tests/runtime/test_uix9_live_metric_evaluator_v2.py tests/runtime/test_uix9_live_proof_protocol.py tests/runtime/test_uix9c_v3_stdin_transport.py -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/cloak/SKILL.md adapters/codex/skills/cloak/SKILL.md skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md adapters/codex/skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR4_INTEGRATION.md tests/runtime/test_cloak_ui_reference_corpus_cuir4.py
          git commit -m "fix(cuir4): preserve frozen UIX9 guidance"
          git push origin HEAD:feat/cloak-cuir4-pattern-intelligence
