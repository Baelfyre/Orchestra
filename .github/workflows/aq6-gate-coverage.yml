name: AQ6 Gate Coverage Truthfulness

on:
  workflow_dispatch:
    inputs:
      comparison_base_sha:
        description: Explicit AQ6 comparison baseline commit SHA
        required: true
        type: string
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aq6-gate-coverage.yml
      - CHANGELOG.md
      - docs/architecture/ADAPTIVE_ASSURANCE_AQ6.md
      - machine/adaptive/aq6-gate-coverage.v1.json
      - machine/schemas/aq6-gate-coverage.v1.schema.json
      - orchestra_runtime/domain/adaptive/__init__.py
      - orchestra_runtime/domain/adaptive/gate_coverage.py
      - README.json
      - scripts/validation/validate_gate_coverage.py
      - tests/behavior/test_gate_coverage.py
      - tests/runtime/test_adaptive_assurance_aq6.py
permissions:
  contents: read

jobs:
  aq6-runtime:
    name: AQ6 runtime contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-cov "jsonschema[format]>=4.21,<5"

      - name: Run AQ6 runtime suite
        run: >-
          python -B -m pytest tests/runtime/test_adaptive_assurance_aq6.py
          --cov=orchestra_runtime.domain.adaptive.gate_coverage
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=97
          --import-mode=importlib
          -q

      - name: Enforce AQ6 branch coverage
        run: python -B -m coverage report --fail-under=95

  aq6-behavior:
    name: AQ6 CLI behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install behavior dependencies
        run: python -m pip install pytest "jsonschema[format]>=4.21,<5"

      - name: Run AQ6 behavior test
        run: |
          python -B -m pytest tests/behavior/test_gate_coverage.py -q
          python -B tests/behavior/test_gate_coverage.py

  aq6-contract:
    name: AQ6 schema and contract parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install contract dependency
        run: python -m pip install "jsonschema[format]>=4.21,<5"

      - name: Validate AQ6 validator entry point
        run: python -B scripts/validation/validate_gate_coverage.py --help

  aq6-scope:
    name: AQ6 exact scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check AQ6 diff scope and whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_DISPATCH_BASE_SHA: ${{ inputs.comparison_base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) comparison_base_sha="$PULL_REQUEST_BASE_SHA" ;;
            workflow_dispatch) comparison_base_sha="$WORKFLOW_DISPATCH_BASE_SHA" ;;
            *) echo "Unsupported AQ6 event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ ! "$comparison_base_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "AQ6 comparison base SHA is missing or invalid" >&2
            exit 1
          fi
          comparison_base_sha="${comparison_base_sha,,}"
          current_head="$(git rev-parse HEAD)"
          if [[ "$comparison_base_sha" == "$current_head" ]]; then
            echo "AQ6 comparison base SHA must not equal candidate HEAD" >&2
            exit 1
          fi
          git cat-file -e "${comparison_base_sha}^{commit}"
          git diff --check "$comparison_base_sha..HEAD"
          git diff --name-only "$comparison_base_sha..HEAD" | sort > actual-paths.txt
          scope_applicability="$(python -B scripts/validation/classify_adaptive_assurance_scope.py --assurance aq7 < actual-paths.txt)"
          case "$scope_applicability" in
            NOT_APPLICABLE)
              echo "AQ6_SCOPE=NOT_APPLICABLE"
              exit 0
              ;;
            APPLICABLE)
              ;;
            *)
              echo "AQ6_SCOPE_CLASSIFICATION_INVALID: $scope_applicability" >&2
              exit 1
              ;;
          esac
          cat > expected-paths.txt <<'EOF'
          .github/workflows/aq6-gate-coverage.yml
          CHANGELOG.md
          docs/architecture/ADAPTIVE_ASSURANCE_AQ6.md
          machine/adaptive/aq6-gate-coverage.v1.json
          machine/schemas/aq6-gate-coverage.v1.schema.json
          orchestra_runtime/domain/adaptive/__init__.py
          orchestra_runtime/domain/adaptive/gate_coverage.py
          README.json
          scripts/validation/classify_adaptive_assurance_scope.py
          scripts/validation/validate_gate_coverage.py
          tests/behavior/test_gate_coverage.py
          tests/runtime/test_adaptive_assurance_aq6.py
          EOF
          sed -i 's/^          //' expected-paths.txt
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt actual-paths.txt
          echo "AQ6_SCOPE=PASS"
