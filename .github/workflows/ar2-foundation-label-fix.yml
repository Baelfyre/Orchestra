name: AR2 Foundation Label Fix

on:
  push:
    branches:
      - chore/runtime-architecture-ar2-closeout

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preserve phase truth
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('README.json')
          text = path.read_text(encoding='utf-8')
          old = '"status": "AR_2_CANONICAL_MERGED_VERIFIED"'
          new = '"status": "AR_2_FOUNDATION_CANONICAL_MERGED_VERIFIED"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one AR-2 full-completion label, found {text.count(old)}')
          text = text.replace(old, new, 1)
          data = json.loads(text)
          cap = data['capabilities']['runtime_architecture_refoundation']
          assert cap['status'] == 'AR_2_FOUNDATION_CANONICAL_MERGED_VERIFIED'
          assert cap['ar3_started'] is False
          assert cap['release_authorized'] is False
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "README.json"
      - name: Commit corrected lifecycle label
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.json
          git commit -m 'chore(ar2): preserve foundation lifecycle scope'
          git push origin HEAD:chore/runtime-architecture-ar2-closeout
