name: CUIR-4 builder dependency repair

on:
  push:
    branches:
      - feat/cloak-cuir4-pattern-intelligence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloak-cuir4-pattern-intelligence
      - name: Repair builder and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cuir4-branch-build.yml')
          text = p.read_text(encoding='utf-8')
          old = '          git diff --check\n          python -m pytest tests/runtime/test_cloak_ui_reference_corpus_cuir4.py -q\n'
          new = '          git diff --check\n          python -m pip install pytest\n          python -m pytest tests/runtime/test_cloak_ui_reference_corpus_cuir4.py -q\n'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          Path('.github/workflows/cuir4-builder-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cuir4-branch-build.yml .github/workflows/cuir4-builder-fix.yml
          git commit -m "chore(cuir4): repair bounded branch builder"
          git push origin HEAD:feat/cloak-cuir4-pattern-intelligence
