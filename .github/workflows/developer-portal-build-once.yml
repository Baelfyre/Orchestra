          nav_old = '    <a href="docs/project/AUTHORITY_CAPABILITY_RUNTIME_ARCHITECTURE.md">Architecture</a> |\n    <a href="docs/governance/GOVERNANCE_LAYER.md">Governance</a> |'
          nav_new = '    <a href="docs/project/AUTHORITY_CAPABILITY_RUNTIME_ARCHITECTURE.md">Architecture</a> |\n    <a href="docs/developer/README.md">Developer Portal</a> |\n    <a href="docs/governance/GOVERNANCE_LAYER.md">Governance</a> |'
