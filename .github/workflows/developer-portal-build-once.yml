          assert changelog_marker in changelog
          entry = '''## Post-v1.5.0 Developer Portal - Candidate\n\n- Adds a repository-native Developer Portal for discovery of stabilized adapter, PRAP certification, host-maturity, specialist, governance, and validation contracts without introducing a new authority layer.\n- Adds a machine-readable portal catalog and JSON Schema plus deterministic tests that require referenced paths, journey references, domain-owner boundaries, and fixed release identity to remain valid.\n- Provides adapter, certification, host-maturity, specialist-extension, governance, and validation contributor journeys by linking canonical surfaces rather than copying their semantics.\n- Keeps PRAP v1, the Host Update contract, the specialist registry, and governance policy authoritative for their existing domains.\n- Explicitly excludes marketplace listing/publication and MCP implementation; both remain separately governed later phases.\n- Performs no release/tag movement, deployment, policy activation, installed-integration refresh, host-maturity promotion, destructive cleanup, branch deletion, force push, or history rewrite. Public `v1.5.0` remains fixed at `b0a56cc7af8ad78234754bcb29ed07f6ab54d920`.\n\n'''
          changelog = changelog.replace(changelog_marker, entry + changelog_marker, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

          python -m pytest -q tests/runtime/test_developer_portal.py
          git diff --check
          git rm .github/workflows/developer-portal-build-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
