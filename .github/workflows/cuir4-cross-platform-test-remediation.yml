name: CUIR-4 cross-platform test remediation

on:
  push:
    branches:
      - feat/cloak-cuir4-pattern-intelligence

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloak-cuir4-pattern-intelligence
          fetch-depth: 0
      - name: Remove platform-sensitive duplicate freeze assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/runtime/test_cloak_ui_reference_corpus_cuir4.py')
          text = p.read_text(encoding='utf-8')
          old = '''    manifest = _json(ROOT / "machine/ui/uix9-live-guidance-manifest.v1.json")
    cloak = next(item for item in manifest["materials"] if item["path"] == "skills/cloak/SKILL.md")
    import hashlib
    assert hashlib.sha256((ROOT / "skills/cloak/SKILL.md").read_bytes()).hexdigest() == cloak["canonical_blob_digest"]
'''
          if old not in text:
              raise SystemExit('Expected platform-sensitive freeze assertion not found')
          p.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          python -m pip install pytest
          git diff --check
          python -m pytest tests/runtime/test_cloak_ui_reference_corpus_cuir4.py tests/runtime/test_uix9_live_metric_evaluator_v2.py tests/runtime/test_uix9_live_proof_protocol.py tests/runtime/test_uix9c_v3_stdin_transport.py -q
          git diff --exit-code origin/main -- skills/cloak/SKILL.md adapters/codex/skills/cloak/SKILL.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime/test_cloak_ui_reference_corpus_cuir4.py
          git commit -m "fix(cuir4): make freeze assertion cross-platform"
          git push origin HEAD:feat/cloak-cuir4-pattern-intelligence
