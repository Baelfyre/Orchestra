name: AR2 README Minimal Diff Repair

on:
  push:
    branches:
      - refactor/runtime-architecture-ar2-shared-canonicalization

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore canonical formatting and insert exact machine parity
        shell: bash
        run: |
          git show b39a0a595bcc1dc8f1d1d4805287c80f778eec29:README.json > README.json
          python - <<'PY'
          from pathlib import Path

          path = Path('README.json')
          text = path.read_text(encoding='utf-8')
          anchor = '      "architecture_validator": "scripts/validation/validate_architecture_boundaries.py",\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'README.json architecture validator anchor count = {text.count(anchor)}')
          insertion = (
              anchor
              + '      "shared_canonicalization_surface": "orchestra_runtime/shared/canonicalization.py",\n'
              + '      "shared_canonicalization_compatibility_surface": "orchestra_runtime/evidence.py",\n'
              + '      "shared_canonicalization_validation_surface": "tests/runtime/test_shared_canonicalization.py",\n'
          )
          path.write_text(text.replace(anchor, insertion, 1), encoding='utf-8')
          PY
      - name: Validate repaired machine index
        run: |
          python -m json.tool README.json > /dev/null
          python tests/behavior/test_readme_machine_index.py
          git diff --check
      - name: Commit repaired README parity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.json
          git commit -m 'fix(architecture): minimize shared canonicalization README parity'
          git push origin HEAD:refactor/runtime-architecture-ar2-shared-canonicalization
