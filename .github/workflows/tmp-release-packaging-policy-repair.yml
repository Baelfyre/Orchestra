name: Release Packaging Policy Parity Bootstrap

on:
  push:
    branches:
      - governance/release-packaging-assurance-scope-20260911

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v7
        with:
          ref: governance/release-packaging-assurance-scope-20260911
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Gate 0 dependency
        run: python -m pip install pytest

      - name: Normalize governance test placement and README machine parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JEO"
          git config user.email "192281269+Baelfyre@users.noreply.github.com"
          git mv tests/runtime/test_release_packaging_assurance_scope.py tests/behavior/test_governance_release_packaging_assurance_scope.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("README.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          capabilities = data.setdefault("capabilities", {})
          capabilities["release_packaging_assurance_scope"] = {
              "status": "HUMAN_POLICY_APPROVED_CANDIDATE",
              "purpose": "Deterministically separates exact release/version/documentation packaging from historical AQ5, AQ6, and PRAI implementation inventories while preserving fail-closed mixed-scope behavior.",
              "human_sources": [
                  "docs/governance/RELEASE_PACKAGING_ASSURANCE_SCOPE_POLICY.md"
              ],
              "classifier": "scripts/validation/classify_adaptive_assurance_scope.py",
              "validation_surface": "tests/behavior/test_governance_release_packaging_assurance_scope.py",
              "authority_class": "HUMAN_POLICY",
              "scope_rule": "EXACT_SET_ONLY_MATCHED_VERSION_DOCS",
              "mixed_or_unknown_scope": "FAIL_CLOSED_APPLICABLE",
              "authority_note": "This classification does not bypass repository qualification, signed materialization, canonical promotion, post-merge verification, or release publication gates."
          }
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          python -B -m pytest tests/behavior/test_governance_release_packaging_assurance_scope.py -q
          python -B -m py_compile scripts/validation/classify_adaptive_assurance_scope.py
          rm .github/workflows/tmp-release-packaging-policy-repair.yml
          git add README.json tests/behavior/test_governance_release_packaging_assurance_scope.py tests/runtime/test_release_packaging_assurance_scope.py scripts/validation/classify_adaptive_assurance_scope.py .github/workflows/tmp-release-packaging-policy-repair.yml
          git diff --cached --check
          git commit -m "fix(governance): align release packaging policy parity"
          git push origin HEAD:governance/release-packaging-assurance-scope-20260911
