name: ADAPT-QA phase separation bootstrap

on:
  push:
    branches:
      - gov/adapt-qa-phase-separation-framework-20260911
    paths:
      - .github/workflows/adapt-qa-phase-separation-bootstrap.yml
      - scripts/tmp_materialize_phase_separation.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize protected framework
        run: python scripts/tmp_materialize_phase_separation.py
      - name: Normalize generated brace escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          for rel in (
              'scripts/validation/classify_adaptive_assurance_scope.py',
              'tests/behavior/test_protected_aq8_assurance_scope_policy.py',
          ):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('{{', '{').replace('}}', '}'), encoding='utf-8')
          PY
      - name: Validate protected scope regressions
        run: python tests/behavior/test_protected_aq8_assurance_scope_policy.py
      - name: Validate registry JSON and Python syntax
        run: |
          python -m json.tool machine/governance/adapt-qa-phase-separation.v1.json > /dev/null
          python -m json.tool machine/schemas/adapt-qa-phase-separation.v1.schema.json > /dev/null
          python -m py_compile scripts/validation/classify_adaptive_assurance_scope.py tests/behavior/test_protected_aq8_assurance_scope_policy.py
      - name: Retire bootstrap and verify final scope
        run: |
          git rm .github/workflows/adapt-qa-phase-separation-bootstrap.yml scripts/tmp_materialize_phase_separation.py
          python - <<'PY'
          import subprocess
          expected = {
              'CHANGELOG.md',
              'README.json',
              'docs/governance/ADAPT_QA_PHASE_SEPARATION_POLICY.md',
              'machine/governance/adapt-qa-phase-separation.v1.json',
              'machine/schemas/adapt-qa-phase-separation.v1.schema.json',
              'scripts/validation/classify_adaptive_assurance_scope.py',
              'tests/behavior/test_protected_aq8_assurance_scope_policy.py',
          }
          tracked = set(subprocess.check_output(['git','diff','--name-only','HEAD^'], text=True).splitlines())
          working = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          final = (tracked | working | untracked) - {
              '.github/workflows/adapt-qa-phase-separation-bootstrap.yml',
              'scripts/tmp_materialize_phase_separation.py',
          }
          if final != expected:
              raise SystemExit(f'final scope mismatch: {sorted(final)}')
          print('ADAPT_QA_PHASE_SEPARATION_SCOPE=PASS')
          PY
          git diff --check
      - name: Commit qualified candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.json docs/governance/ADAPT_QA_PHASE_SEPARATION_POLICY.md machine/governance/adapt-qa-phase-separation.v1.json machine/schemas/adapt-qa-phase-separation.v1.schema.json scripts/validation/classify_adaptive_assurance_scope.py tests/behavior/test_protected_aq8_assurance_scope_policy.py
          git commit -m 'gov: add reusable ADAPT-QA phase separation framework'
          git push origin HEAD:gov/adapt-qa-phase-separation-framework-20260911
