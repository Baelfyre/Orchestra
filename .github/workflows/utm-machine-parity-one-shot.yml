name: UTM machine parity one-shot

on:
  push:
    branches:
      - feat/unified-testing-mechanism-t0-t9-20260830

permissions:
  contents: write

jobs:
  patch-machine-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: feat/unified-testing-mechanism-t0-t9-20260830
          fetch-depth: 0

      - name: Patch README machine index and changelog
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.json")
          text = readme.read_text(encoding="utf-8")
          anchor = '    "validation_and_evidence": {"status": "IMPLEMENTED", "machine_sources": ["machine/schemas/", "machine/release-evidence/"], "human_sources": ["docs/setup/VALIDATION.md", "docs/validation/"]},\n    "prime_directive_feature_admission_v1": {'
          if text.count(anchor) != 1:
              raise SystemExit("README parity anchor missing or ambiguous")
          entry = '''    "validation_and_evidence": {"status": "IMPLEMENTED", "machine_sources": ["machine/schemas/", "machine/release-evidence/"], "human_sources": ["docs/setup/VALIDATION.md", "docs/validation/"]},
    "unified_testing_mechanism_t0_t9": {
      "status": "EXPERIMENTAL_EFFICACY_PENDING",
      "purpose": "Provide a revision-bound T0-T9 applicability and evidence-aggregation contract that reuses existing specialist and CI validation without creating a second test framework or protected-action authority.",
      "machine_sources": ["machine/features/unified-testing-mechanism.v1.json", "machine/schemas/unified-testing-packet.v1.schema.json"],
      "human_sources": ["docs/project/UNIFIED_TESTING_MECHANISM.md"],
      "runtime_surface": "orchestra_runtime/unified_testing.py",
      "validation_surface": "tests/runtime/test_unified_testing.py",
      "admission": "EXPERIMENT_ONLY",
      "promotion": "PENDING",
      "default_release_intent": "NON_RELEASE",
      "runtime_integration": false,
      "authority_note": "UTM readiness aggregation is evidence only. READINESS_EVIDENCE_COMPLETE does not grant merge, release, deployment, policy activation, destructive, integration-refresh, or other protected-action authority; permanent adoption remains pending controlled efficacy evidence."
    },
    "prime_directive_feature_admission_v1": {'''
          readme.write_text(text.replace(anchor, entry), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          heading = "# Changelog\n"
          if not changelog_text.startswith(heading):
              raise SystemExit("CHANGELOG heading not found")
          note = '''# Changelog

## Post-v1.7 Unified Testing Mechanism Experimental Candidate

- Added an `EXPERIMENT_ONLY` T0-T9 applicability and revision-bound evidence aggregation candidate that reuses existing specialist and CI validation surfaces rather than creating a second QA engine.
- Added deterministic fail-closed handling for missing, pending, failed, stale-revision, non-applicable, and malformed stage evidence while preserving `READINESS_EVIDENCE_COMPLETE != RELEASE_AUTHORITY` and all existing protected-action gates.
- Permanent promotion remains `PENDING` until the approved controlled baseline-versus-UTM efficacy campaign establishes measurable value relative to complexity and operating cost.
'''
          if "## Post-v1.7 Unified Testing Mechanism Experimental Candidate" not in changelog_text:
              changelog.write_text(note + changelog_text[len(heading):], encoding="utf-8")

      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/utm-machine-parity-one-shot.yml

      - name: Commit parity-only remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.json CHANGELOG.md .github/workflows/utm-machine-parity-one-shot.yml
          git diff --cached --check
          git commit -m "docs(machine): index experimental UTM"
          git push origin HEAD:feat/unified-testing-mechanism-t0-t9-20260830
