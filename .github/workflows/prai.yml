name: PRAI Post-Run Assurance

on:
  workflow_dispatch:
    inputs:
      approved_base_sha:
        description: Explicit approved evidence baseline commit SHA
        required: true
        type: string
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aq6-gate-coverage.yml
      - .github/workflows/prai.yml
      - .github/workflows/qa-compliance.yml
      - CHANGELOG.md
      - README.json
      - docs/architecture/ADAPTIVE_ASSURANCE_AQ6.md
      - docs/architecture/ADAPTIVE_ASSURANCE_PRAI.md
      - machine/adaptive/aq6-gate-coverage.v1.json
      - machine/adaptive/prai-post-run-assurance.v1.json
      - machine/schemas/aq6-gate-coverage.v1.schema.json
      - machine/schemas/prai-post-run-assurance.v1.schema.json
      - orchestra_runtime/domain/adaptive/__init__.py
      - orchestra_runtime/domain/adaptive/gate_coverage.py
      - orchestra_runtime/domain/adaptive/prai.py
      - scripts/validation/validate_gate_coverage.py
      - scripts/validation/validate_prai.py
      - tests/behavior/test_gate_coverage.py
      - tests/behavior/test_prai.py
      - tests/runtime/test_adaptive_assurance_aq6.py
      - tests/runtime/test_prai.py

permissions:
  contents: read

env:
  ORCHESTRA_APPROVED_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_base_sha || '' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install contract dependencies
        run: python -m pip install --upgrade pip "jsonschema[format]>=4.21,<5"

      - name: Validate declarative contract and runtime parity
        run: >-
          python -B -c
          "import json;
          from pathlib import Path;
          from jsonschema import Draft202012Validator;
          from orchestra_runtime.domain.adaptive.prai import validate_prai_contract, validate_schema_runtime_parity;
          root=Path('.');
          contract=json.loads((root/'machine/adaptive/prai-post-run-assurance.v1.json').read_text(encoding='utf-8'));
          schema=json.loads((root/'machine/schemas/prai-post-run-assurance.v1.schema.json').read_text(encoding='utf-8'));
          validate_prai_contract(contract);
          validate_schema_runtime_parity(contract, schema);
          Draft202012Validator.check_schema(schema);
          print('PRAI_CONTRACT=PASS')"

  focused:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade pip pytest pytest-cov hypothesis==6.163.0
          "jsonschema[format]>=4.21,<5"

      - name: Run PRAI runtime and behavior tests
        run: >-
          python -B -m pytest tests/runtime/test_prai.py tests/behavior/test_prai.py --import-mode=importlib -q

      - name: Run fail-closed CLI syntax check
        run: >-
          python -B scripts/validation/validate_prai.py --help

  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve approved comparison base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ inputs.approved_base_sha }}"
          fi
          if [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid comparison base SHA" >&2
            exit 1
          fi
          git cat-file -e "$base^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Enforce exact PRAI inventory and diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA..HEAD"
          mapfile -t actual < <(git diff --name-only "$BASE_SHA..HEAD" | sort)
          expected=(
            ".github/workflows/prai.yml"
            ".github/workflows/qa-compliance.yml"
            "CHANGELOG.md"
            "README.json"
            "docs/architecture/ADAPTIVE_ASSURANCE_PRAI.md"
            "machine/adaptive/prai-post-run-assurance.v1.json"
            "machine/schemas/prai-post-run-assurance.v1.schema.json"
            "orchestra_runtime/domain/adaptive/prai.py"
            "scripts/validation/validate_prai.py"
            "tests/behavior/test_prai.py"
            "tests/runtime/test_prai.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#actual[@]}" -eq "${#expected_sorted[@]}" ] && diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "PRAI_SCOPE=PASS"
            exit 0
          fi
          aq6_expected=(
            ".github/workflows/aq6-gate-coverage.yml"
            ".github/workflows/prai.yml"
            ".github/workflows/qa-compliance.yml"
            "CHANGELOG.md"
            "README.json"
            "docs/architecture/ADAPTIVE_ASSURANCE_AQ6.md"
            "machine/adaptive/aq6-gate-coverage.v1.json"
            "machine/schemas/aq6-gate-coverage.v1.schema.json"
            "orchestra_runtime/domain/adaptive/__init__.py"
            "orchestra_runtime/domain/adaptive/gate_coverage.py"
            "scripts/validation/validate_gate_coverage.py"
            "tests/behavior/test_gate_coverage.py"
            "tests/runtime/test_adaptive_assurance_aq6.py"
          )
          mapfile -t aq6_expected_sorted < <(printf '%s\n' "${aq6_expected[@]}" | sort)
          if [ "${#actual[@]}" -eq "${#aq6_expected_sorted[@]}" ] && diff -u <(printf '%s\n' "${aq6_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "PRAI_SCOPE=AQ6_COMPATIBILITY_PASS"
            exit 0
          fi
          printf 'Actual paths:\n%s\n' "${actual[*]}" >&2
          exit 1
