name: CUIR-3 branch remediation

on:
  push:
    branches:
      - feat/cloak-cuir3-native-normalization

permissions:
  contents: write

jobs:
  remediate:
    if: github.repository == 'Baelfyre/Orchestra' && github.ref == 'refs/heads/feat/cloak-cuir3-native-normalization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloak-cuir3-native-normalization
          fetch-depth: 0

      - name: Apply bounded CUIR-3 parity remediation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          catalog_path = root / 'machine/knowledge/cloak-ui-reference-cuir3.v1.json'
          catalog_text = catalog_path.read_text(encoding='utf-8')
          if '"normalized_pattern_count": 15' in catalog_text:
              catalog_text = catalog_text.replace('"normalized_pattern_count": 15', '"normalized_pattern_count": 16', 1)
              catalog_path.write_text(catalog_text, encoding='utf-8')

          test_path = root / 'tests/runtime/test_cloak_ui_reference_corpus_cuir3.py'
          test_text = test_path.read_text(encoding='utf-8')
          if 'EXPECTED_PATTERN_COUNT = 15' in test_text:
              test_text = test_text.replace('EXPECTED_PATTERN_COUNT = 15', 'EXPECTED_PATTERN_COUNT = 16', 1)
              test_path.write_text(test_text, encoding='utf-8')

          human_path = root / 'docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR3_NORMALIZATION.md'
          human_text = human_path.read_text(encoding='utf-8')
          if '12 category families and 15 normalized patterns.' in human_text:
              human_text = human_text.replace('12 category families and 15 normalized patterns.', '12 category families and 16 normalized patterns.', 1)
              human_path.write_text(human_text, encoding='utf-8')

          readme_path = root / 'README.json'
          readme = readme_path.read_text(encoding='utf-8')
          if '"cloak_ui_reference_corpus_cuir3"' not in readme:
              start = readme.index('    "cloak_ui_reference_corpus_cuir2": {')
              end = readme.index('    "cross_specialist_coordination":', start)
              cuir2_segment = readme[start:end]
              if '"cuir3_started": false' not in cuir2_segment:
                  raise SystemExit('CUIR-2 projection did not contain expected cuir3_started=false guard')
              cuir2_segment = cuir2_segment.replace('"cuir3_started": false', '"cuir3_started": true', 1)
              cuir3_block = '''    "cloak_ui_reference_corpus_cuir3": {
                "status": "CUIR_3_NORMALIZATION_CANDIDATE_PENDING_CANONICALIZATION",
                "purpose": "Normalize canonical CUIR-2 static findings into a compact Orchestra-native, provenance-aware Cloak pattern vocabulary without runtime integration or automatic retrieval.",
                "machine_sources": ["machine/knowledge/cloak-ui-reference-cuir3.v1.json", "machine/schemas/cloak-ui-normalized-pattern.v1.schema.json"],
                "human_sources": ["docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR3_NORMALIZATION.md"],
                "validation_surface": "tests/runtime/test_cloak_ui_reference_corpus_cuir3.py",
                "source_analysis_record_count": 23,
                "normalized_pattern_count": 16,
                "runtime_integration": false,
                "automatic_retrieval": false,
                "external_code_execution": false,
                "automatic_ingestion": false,
                "source_copying": false,
                "asset_copying": false,
                "cuir4_started": false,
                "authority_note": "CUIR-3 is normalized reference knowledge only. It does not authorize runtime or automatic retrieval integration, source or asset copying, external execution, implementation, provider routing or fallback, release, deployment, production mutation, or policy activation."
              },
          '''
              readme = readme[:start] + cuir2_segment + cuir3_block + readme[end:]

              maturity_old = '    "cloak_ui_reference_corpus_cuir1": "CUIR_1_CANONICAL_MERGED_VERIFIED"\n  },'
              maturity_new = '    "cloak_ui_reference_corpus_cuir1": "CUIR_1_CANONICAL_MERGED_VERIFIED",\n    "cloak_ui_reference_corpus_cuir2": "CUIR_2_CANONICAL_MERGED_VERIFIED",\n    "cloak_ui_reference_corpus_cuir3": "CUIR_3_NORMALIZATION_CANDIDATE_PENDING_CANONICALIZATION"\n  },'
              if maturity_old not in readme:
                  raise SystemExit('README maturity anchor not found')
              readme = readme.replace(maturity_old, maturity_new, 1)

              guidance_old = '    "do_not_treat_cuir1_reference_only_sources_as_copy_or_execution_authority": true,\n    "do_not_infer_cuir2_authority_from_cuir1_canonicalization": true\n  }'
              guidance_new = '    "do_not_treat_cuir1_reference_only_sources_as_copy_or_execution_authority": true,\n    "do_not_infer_cuir2_authority_from_cuir1_canonicalization": true,\n    "treat_cuir2_as_canonical_static_analysis_only": true,\n    "do_not_treat_cuir2_reference_findings_as_copy_or_execution_authority": true,\n    "treat_cuir3_as_normalized_reference_knowledge_only_until_canonicalized": true,\n    "do_not_infer_cuir4_authority_from_cuir3_candidate_state": true\n  }'
              if guidance_old not in readme:
                  raise SystemExit('README AI review guidance anchor not found')
              readme = readme.replace(guidance_old, guidance_new, 1)
              json.loads(readme)
              readme_path.write_text(readme, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## Post-v1.7 Cloak CUIR-3 Orchestra-native normalization candidate'
          if heading not in changelog:
              anchor = '# Changelog\n\n'
              if not changelog.startswith(anchor):
                  raise SystemExit('CHANGELOG anchor not found')
              entry = '''## Post-v1.7 Cloak CUIR-3 Orchestra-native normalization candidate

          - Normalized the canonical 23-record CUIR-2 static-analysis corpus into 16 evidence-bound Orchestra-native UI/reference patterns covering navigation, forms and input, selection and disclosure, status and progress, action hierarchy, data and summaries, content grouping, collections, accessibility, motion, and icon semantics.
          - Added a strict normalized-pattern schema, machine knowledge catalog, human normalization record, and deterministic CUIR-3 runtime validation with complete CUIR-2 provenance accounting and no unknown or silently dropped analysis records.
          - Preserved `REFERENCE_ONLY`, `REUSE_WITH_NOTICE`, and `REUSE_WITH_RIGHTS_REVIEW` classifications; kept general UI icon notice obligations separate from brand-icon rights review; rejected observed accessibility regressions instead of normalizing them.
          - CUIR-3 performs no new external source inspection or revision refresh, source or asset copying, external execution, dependency installation, automatic ingestion, runtime integration, automatic pattern retrieval, provider routing or fallback, release, deployment, production mutation, or policy activation. CUIR-4 remains not started.

          '''
              changelog = anchor + entry + changelog[len(anchor):]
              changelog_path.write_text(changelog, encoding='utf-8')

          parsed_catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          assert len(parsed_catalog['patterns']) == 16
          assert parsed_catalog['coverage']['normalized_pattern_count'] == 16
          parsed_readme = json.loads(readme_path.read_text(encoding='utf-8'))
          cuir3 = parsed_readme['capabilities']['cloak_ui_reference_corpus_cuir3']
          assert cuir3['normalized_pattern_count'] == 16
          assert cuir3['cuir4_started'] is False
          assert parsed_readme['capabilities']['cloak_ui_reference_corpus_cuir2']['cuir3_started'] is True
          PY

      - name: Commit bounded remediation if needed
        shell: bash
        run: |
          if git diff --quiet -- README.json CHANGELOG.md machine/knowledge/cloak-ui-reference-cuir3.v1.json docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR3_NORMALIZATION.md tests/runtime/test_cloak_ui_reference_corpus_cuir3.py; then
            echo "CUIR3_BRANCH_REMEDIATION=NO_CHANGES"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.json CHANGELOG.md machine/knowledge/cloak-ui-reference-cuir3.v1.json docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR3_NORMALIZATION.md tests/runtime/test_cloak_ui_reference_corpus_cuir3.py
          git commit -m "fix(cuir3): reconcile normalization and documentation parity"
          git push origin HEAD:feat/cloak-cuir3-native-normalization
