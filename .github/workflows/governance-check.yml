name: Governance Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  artifact-metadata: write

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Create Artifacts Directory
        run: mkdir -p artifacts

      - name: Validate Runtime Architecture Boundaries
        run: |
          python scripts/validation/validate_architecture_boundaries.py > artifacts/architecture_boundaries_report.txt
          cat artifacts/architecture_boundaries_report.txt

      - name: Test Runtime Architecture Boundary Validator
        run: python tests/behavior/test_architecture_boundaries.py

      - name: Test Documentation Contracts
        run: |
          python tests/behavior/test_readme_impact.py
          python tests/behavior/test_readme_machine_index.py

      - name: Enforce Documentation Impact Gate
        run: |
          set +e
          python scripts/check_readme_impact.py > artifacts/readme_impact_report.txt
          status=$?
          set -e

          cat artifacts/readme_impact_report.txt
          exit $status

      - name: Run Router Benchmark Validation
        run: |
          python scripts/router_benchmark_runner.py > artifacts/router_benchmark_report.txt
          cat artifacts/router_benchmark_report.txt

      - name: Run Negative Router Benchmark Validation
        run: |
          python tests/behavior/test_router_benchmark_fixture_validation.py > artifacts/router_benchmark_negative_fixture_report.txt
          cat artifacts/router_benchmark_negative_fixture_report.txt

      - name: Measure Prompt Load
        run: |
          python scripts/measure_prompt_load.py > artifacts/prompt_load_metrics.txt
          cat artifacts/prompt_load_metrics.txt

      - name: Check Prompt Load Thresholds
        run: |
          python scripts/check_prompt_load_thresholds.py > artifacts/prompt_load_threshold_report.txt
          cat artifacts/prompt_load_threshold_report.txt

      - name: Run Project Context Validation
        run: |
          python scripts/validate_project_context.py > artifacts/project_context_report.txt
          cat artifacts/project_context_report.txt

      - name: Run Stage 1 Strict Governance Check
        run: |
          set +e
          python scripts/governance_check.py --strict > artifacts/governance_report.txt
          status=$?
          set -e

          cat artifacts/governance_report.txt
          exit $status

      - name: Run Phase 2 Dagger Guardrail Simulation Test
        run: |
          python scripts/test_dagger_guardrail.py > artifacts/dagger_guardrail_report.txt
          cat artifacts/dagger_guardrail_report.txt

      - name: Run Governance Behavior Tests
        run: |
          python tests/behavior/evaluate_governance.py > artifacts/evaluate_governance_report.txt
          cat artifacts/evaluate_governance_report.txt

      - name: Run General Behavior Tests
        run: |
          python tests/behavior/run_tests.py > artifacts/run_tests_report.txt
          cat artifacts/run_tests_report.txt

      - name: Validate plugin.json Syntax
        run: python -m json.tool plugin.json > /dev/null

      - name: Generate CI Summary
        run: |
          echo "# Governance Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "## Stage 1 Strict Deterministic Gates: ON" >> $GITHUB_STEP_SUMMARY
          echo "Documentation Impact Gate, runtime architecture boundary enforcement, and Stage 1 strict deterministic governance validation completed. Review artifacts and logs for any fail-closed findings." >> $GITHUB_STEP_SUMMARY

      - name: Upload Governance Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-validation-report
          path: artifacts/
          retention-days: 14
