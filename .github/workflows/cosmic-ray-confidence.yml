name: cosmic-ray-confidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cosmic-ray.toml"
      - ".github/workflows/cosmic-ray-confidence.yml"
      - "scripts/validation/build_cosmic_ray_evidence.py"
      - "machine/schemas/cosmic-ray-evidence.schema.json"
      - "machine/provenance/third-party.v1.json"
      - "docs/THIRD_PARTY_PROVENANCE.md"
      - "README.json"
      - "orchestra_runtime/evidence.py"
      - "orchestra_runtime/governance_kernel.py"
      - "orchestra_runtime/preexecution.py"
      - "tests/runtime/test_evidence_kernel.py"
      - "tests/runtime/test_governance_kernel.py"
      - "tests/runtime/test_preexecution.py"

permissions:
  contents: read

jobs:
  bounded-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded mutation dependencies
        run: >-
          python -m pip install --upgrade pip
          pytest
          cosmic-ray==8.7.0
          jsonschema

      - name: Prepare evidence directory
        run: mkdir -p artifacts/cosmic-ray

      - name: Record Cosmic Ray version
        run: >-
          python -c "import importlib.metadata; print(importlib.metadata.version('cosmic-ray'))"
          | tee artifacts/cosmic-ray/tool-version.txt

      - name: Initialize bounded mutation session
        id: init
        shell: bash
        run: |
          set +e
          set -o pipefail
          cosmic-ray --verbosity=INFO init cosmic-ray.toml artifacts/cosmic-ray/session.sqlite 2>&1 | tee artifacts/cosmic-ray/init.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee artifacts/cosmic-ray/init-exit-code.txt
          exit 0

      - name: Baseline unmutated tests
        id: baseline
        shell: bash
        run: |
          set +e
          set -o pipefail
          cosmic-ray --verbosity=INFO baseline cosmic-ray.toml 2>&1 | tee artifacts/cosmic-ray/baseline.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee artifacts/cosmic-ray/baseline-exit-code.txt
          exit 0

      - name: Execute bounded mutation pilot
        id: exec
        shell: bash
        run: |
          init_code="$(cat artifacts/cosmic-ray/init-exit-code.txt)"
          baseline_code="$(cat artifacts/cosmic-ray/baseline-exit-code.txt)"
          if [ "$init_code" != "0" ] || [ "$baseline_code" != "0" ]; then
            echo "Mutation execution skipped because init or baseline failed." | tee artifacts/cosmic-ray/exec.txt
            echo "97" | tee artifacts/cosmic-ray/exec-exit-code.txt
            exit 0
          fi
          set +e
          set -o pipefail
          cosmic-ray --verbosity=INFO exec cosmic-ray.toml artifacts/cosmic-ray/session.sqlite 2>&1 | tee artifacts/cosmic-ray/exec.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee artifacts/cosmic-ray/exec-exit-code.txt
          exit 0

      - name: Record mutation report
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f artifacts/cosmic-ray/session.sqlite ]; then
            cr-report artifacts/cosmic-ray/session.sqlite --show-pending 2>&1 | tee artifacts/cosmic-ray/report.txt
          else
            echo "No Cosmic Ray session database was produced." | tee artifacts/cosmic-ray/report.txt
          fi
          exit 0

      - name: Build machine-readable Cosmic Ray evidence
        if: always()
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          python scripts/validation/build_cosmic_ray_evidence.py \
            --init-output artifacts/cosmic-ray/init.txt \
            --baseline-output artifacts/cosmic-ray/baseline.txt \
            --exec-output artifacts/cosmic-ray/exec.txt \
            --report-output artifacts/cosmic-ray/report.txt \
            --session-database artifacts/cosmic-ray/session.sqlite \
            --config cosmic-ray.toml \
            --init-exit-code "$(cat artifacts/cosmic-ray/init-exit-code.txt)" \
            --baseline-exit-code "$(cat artifacts/cosmic-ray/baseline-exit-code.txt)" \
            --exec-exit-code "$(cat artifacts/cosmic-ray/exec-exit-code.txt)" \
            --tool-version "$(cat artifacts/cosmic-ray/tool-version.txt)" \
            --tested-sha "$(git rev-parse HEAD)" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME" \
            --output artifacts/cosmic-ray/cosmic-ray-evidence.json

      - name: Validate machine-readable evidence schema
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path('machine/schemas/cosmic-ray-evidence.schema.json').read_text())
          evidence = json.loads(Path('artifacts/cosmic-ray/cosmic-ray-evidence.json').read_text())
          jsonschema.validate(evidence, schema)
          print('COSMIC_RAY_EVIDENCE_SCHEMA=PASS')
          PY

      - name: Upload Cosmic Ray evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosmic-ray-confidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cosmic-ray/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce scoreable compatibility pilot
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('artifacts/cosmic-ray/cosmic-ray-evidence.json').read_text())
          status = evidence['execution']['score_status']
          score = evidence['mutation_summary']['mutation_score_percent']
          print(f'COSMIC_RAY_SCORE_STATUS={status}')
          print(f'COSMIC_RAY_MUTATION_SCORE={score}')
          if status != 'VALID_SCORE':
              raise SystemExit(1)
          PY
