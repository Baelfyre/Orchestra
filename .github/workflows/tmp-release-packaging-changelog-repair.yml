name: Release Packaging Changelog Repair

on:
  push:
    branches:
      - governance/release-packaging-assurance-scope-20260911

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: governance/release-packaging-assurance-scope-20260911
          fetch-depth: 0
      - name: Add focused changelog entry and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JEO"
          git config user.email "192281269+Baelfyre@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          current = path.read_text(encoding="utf-8")
          entry = """## Unreleased governance policy: deterministic release-packaging assurance scope\n\n- Adds the human-authorized exact-set `RELEASE_PACKAGING` classification for historical PRAI/AQ5/AQ7 exact-scope gates without changing their implementation inventories or assurance thresholds.\n- Requires the complete fixed release/version/documentation/test surface plus exactly one matching versioned release-candidate document and release-readiness evidence document.\n- Keeps partial, mixed, superset, runtime, governance, provider, telemetry, deployment, unknown, mismatched-version, duplicate, and unsafe scopes fail-closed `APPLICABLE` or invalid.\n- Preserves Governance, validate, Required Analysis, Cross-platform, Cosmic Ray, CodeQL, signed-materialization, canonical-promotion, post-merge, publication, AQ15+, provider, telemetry, production, deployment, secret, and CritiQual CUD10 authority boundaries.\n\n"""
          if not current.startswith("## Unreleased governance policy: deterministic release-packaging assurance scope"):
              path.write_text(entry + current, encoding="utf-8")
          PY
          rm .github/workflows/tmp-release-packaging-changelog-repair.yml
          git add -A
          git diff --cached --check
          git commit -m "docs(governance): record release packaging scope change"
          git push origin HEAD:governance/release-packaging-assurance-scope-20260911
