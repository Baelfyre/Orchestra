name: mutation-confidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "setup.cfg"
      - ".github/workflows/mutation-confidence.yml"
      - "scripts/validation/build_mutation_evidence.py"
      - "machine/schemas/mutation-evidence.schema.json"
      - "orchestra_runtime/evidence.py"
      - "orchestra_runtime/machine_contracts.py"
      - "orchestra_runtime/compliance_protocol.py"
      - "orchestra_runtime/governance_kernel.py"
      - "orchestra_runtime/preexecution.py"
      - "orchestra_runtime/context_state.py"
      - "orchestra_runtime/host_protocol.py"
      - "orchestra_runtime/remediation_circuit.py"
      - "orchestra_runtime/shadow_conformance.py"
      - "orchestra_runtime/workflow_contracts.py"
      - "orchestra_runtime/test_evidence.py"
      - "tests/runtime/test_evidence_kernel.py"
      - "tests/runtime/test_machine_contracts.py"
      - "tests/runtime/test_compliance_protocol.py"
      - "tests/runtime/test_governance_kernel.py"
      - "tests/runtime/test_preexecution.py"
      - "tests/runtime/test_context_state.py"
      - "tests/runtime/test_host_protocol.py"
      - "tests/runtime/test_remediation_circuit.py"
      - "tests/runtime/test_shadow_conformance.py"
      - "tests/runtime/test_workflow_sanity.py"
      - "tests/runtime/test_test_evidence.py"
      - "tests/runtime/test_refoundation_guard_edges.py"
      - "tests/runtime/test_refoundation_contract_failures.py"
      - "tests/runtime/test_refoundation_receipt_success_edges.py"
      - "tests/runtime/test_refoundation_critical_branches.py"
      - "tests/runtime/test_refoundation_final_critical_gaps.py"
      - "tests/runtime/test_refoundation_branch_gate.py"
      - "tests/runtime/test_refoundation_properties.py"

permissions:
  contents: read

jobs:
  mutation-confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded mutation dependencies
        run: >-
          python -m pip install --upgrade pip
          pytest
          hypothesis==6.163.0
          mutmut==3.6.0

      - name: Prepare mutation evidence directory
        run: mkdir -p artifacts/mutation

      - name: Record mutation tool version
        run: >-
          python -c "import importlib.metadata; print(importlib.metadata.version('mutmut'))"
          | tee artifacts/mutation/mutmut-version.txt

      - name: Run bounded trust-module mutation baseline
        id: mutation
        shell: bash
        run: |
          set +e
          set -o pipefail
          mutmut run 2>&1 | tee artifacts/mutation/mutmut-run.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee artifacts/mutation/mutmut-run-exit-code.txt
          exit 0

      - name: Record raw mutation results
        if: always()
        shell: bash
        run: |
          set +e
          mutmut results 2>&1 | tee artifacts/mutation/mutmut-results.txt
          exit 0

      - name: Build machine-readable mutation evidence
        if: always()
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          python scripts/validation/build_mutation_evidence.py \
            --run-output artifacts/mutation/mutmut-run.txt \
            --results-output artifacts/mutation/mutmut-results.txt \
            --config setup.cfg \
            --run-exit-code "$(cat artifacts/mutation/mutmut-run-exit-code.txt)" \
            --tool-version "$(cat artifacts/mutation/mutmut-version.txt)" \
            --tested-sha "$(git rev-parse HEAD)" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME" \
            --output artifacts/mutation/mutation-evidence.json

      - name: Upload mutation evidence baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-confidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mutation/
          if-no-files-found: error
          retention-days: 90
