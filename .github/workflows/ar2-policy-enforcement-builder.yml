name: AR2 Policy Enforcement Builder

on:
  push:
    branches:
      - feat/runtime-architecture-ar2-policy-enforcement

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install focused validation dependencies
        run: python -m pip install pytest 'jsonschema[format]>=4.21,<5'
      - name: Apply durable non-workflow parity updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'README.json',
              '      "validation_surface": "tests/runtime/test_runtime_architecture_boundaries.py",\n',
              '      "validation_surface": "tests/runtime/test_runtime_architecture_boundaries.py",\n'
              '      "machine_policy": "machine/governance/runtime-architecture-boundaries.v1.json",\n'
              '      "machine_policy_schema": "machine/schemas/runtime-architecture-boundaries.v1.schema.json",\n'
              '      "architecture_validator": "scripts/validation/validate_architecture_boundaries.py",\n'
              '      "ci_enforcement": ["Governance Check", "validate"],\n'
          )
          replace_once(
              'README.json',
              '      "canonical_layers": ["domain", "application", "infrastructure", "bootstrap", "shared", "resources"],',
              '      "canonical_layers": ["domain", "application", "infrastructure", "entrypoints", "bootstrap", "shared", "resources"],'
          )

          doc = Path('docs/project/ORCHESTRA_RUNTIME_ARCHITECTURE_REFOUNDATION.md')
          text = doc.read_text(encoding='utf-8')
          replacements = {
              'persistence objects, interfaces, composition, and resources': 'persistence objects, entrypoints, composition, and resources',
              '├── interfaces/': '├── entrypoints/',
              'interfaces -> application -> domain': 'entrypoints -> application -> domain',
              '`interfaces` translate external interaction into application requests/use cases.': '`entrypoints` translate external interaction into application requests/use cases.',
              'application, infrastructure, interfaces, repository `internal/`': 'application, infrastructure, entrypoints, repository `internal/`',
              'concrete infrastructure.\n- `infrastructure` implements ports and may depend inward on application/domain contracts.\n- `interfaces` translate': 'concrete infrastructure.\n- `infrastructure` implements ports and may depend inward on application/domain contracts.\n- `entrypoints` translate',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          doc.write_text(text, encoding='utf-8')

          test = Path('tests/runtime/test_runtime_architecture_boundaries.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace('orchestra_runtime.interfaces', 'orchestra_runtime.entrypoints')
          text = text.replace('    "interfaces": ("internal",),', '    "entrypoints": ("internal",),')
          test.write_text(text, encoding='utf-8')

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          marker = '\n\n\n## Repo Source vs Runtime Rule'
          if marker not in text:
              raise SystemExit('AGENTS.md insertion marker missing')
          rule = (
              '\n12. **Runtime Architecture Placement Rule**: New or migrated `orchestra_runtime` code must be placed under the bounded architecture defined by '
              '`machine/governance/runtime-architecture-boundaries.v1.json` and must pass `python scripts/validation/validate_architecture_boundaries.py`. '
              'Do not add new flat runtime implementation modules, unrecognized runtime package roots, DTOs/DPOs outside their declared zones, repository abstractions outside port/persistence zones, domain dependencies on infrastructure/entrypoints, or production runtime dependencies on repository `internal/`. '
              'If ownership is ambiguous, stop at Clockwork architecture review before implementation; validation success never grants implementation or release authority.'
          )
          text = text.replace(marker, rule + marker, 1)
          agents.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '# Changelog\n\n'
          if not text.startswith(anchor):
              raise SystemExit('CHANGELOG.md header mismatch')
          section = '''## Post-v1.7 runtime architecture AR-2 machine placement enforcement candidate\n\n- Promotes runtime placement rules into the versioned `machine/governance/runtime-architecture-boundaries.v1.json` contract with a strict Draft 2020-12 schema and reusable standalone validator.\n- Enforces new-flat-module, unknown-package-root, dependency-direction, DTO/DPO, repository-zone, compatibility-facade, repository-`internal/`, and direct domain-I/O boundaries while grandfathering only explicitly recorded migration debt.\n- Wires the same validator into Governance Check and the main validate workflow, keeps pytest architecture regression coverage, and adds an agent-facing placement rule so future files must identify their bounded owner before implementation.\n- Standardizes the external runtime layer name as `entrypoints/` to avoid collision with legacy `orchestra_runtime/interfaces.py`, which remains migration debt until its application-port extraction. No runtime behavior, public-import retirement, release, deployment, policy activation, provider routing/fallback, destructive action, branch deletion, force push, or history rewrite is introduced.\n\n'''
          changelog.write_text(anchor + section + text[len(anchor):], encoding='utf-8')
          PY
      - name: Run focused architecture validation
        run: |
          python -m json.tool machine/governance/runtime-architecture-boundaries.v1.json > /dev/null
          python -m json.tool machine/schemas/runtime-architecture-boundaries.v1.schema.json > /dev/null
          python scripts/validation/validate_architecture_boundaries.py
          python -m pytest tests/runtime/test_runtime_architecture_boundaries.py tests/runtime/test_runtime_architecture_policy.py -q
          git diff --check
      - name: Commit durable non-workflow parity candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.json AGENTS.md CHANGELOG.md docs/project/ORCHESTRA_RUNTIME_ARCHITECTURE_REFOUNDATION.md tests/runtime/test_runtime_architecture_boundaries.py
          git commit -m 'feat(architecture): enforce runtime placement policy parity'
          git push origin HEAD:feat/runtime-architecture-ar2-policy-enforcement
