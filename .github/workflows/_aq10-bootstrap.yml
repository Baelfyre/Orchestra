name: AQ10 Bootstrap

on:
  push:
    branches:
      - feat/aq10-defect-escape-rca-20260911
    paths:
      - .github/workflows/_aq10-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AQ10 branch
        uses: actions/checkout@v4
        with:
          ref: feat/aq10-defect-escape-rca-20260911
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest 'jsonschema[format]>=4.21,<5'
      - name: Materialize and qualify exact AQ10 inventory
        run: python scripts/_aq10_bootstrap.py
