name: Temporary whitelist authority README parity

on:
  push:
    branches:
      - governance/whitelist-human-only-authority-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: governance/whitelist-human-only-authority-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch exact README machine index entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('README.json')
          text = path.read_text(encoding='utf-8')
          old = '    "aq8_canonical_closeout_whitelist_policy": "docs/governance/AQ8_ASSURANCE_SCOPE_POLICY.md"\n'
          new = (
              '    "aq8_canonical_closeout_whitelist_policy": "docs/governance/AQ8_ASSURANCE_SCOPE_POLICY.md",\n'
              '    "whitelist_human_only_authority": "docs/governance/PROTECTED_GOVERNANCE_ESCALATION_PROTOCOL.md"\n'
          )
          assert text.count(old) == 1, f'expected exactly one README anchor, found {text.count(old)}'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          json.loads(path.read_text(encoding='utf-8'))
          PY
          git diff --check
      - name: Commit README parity and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-whitelist-human-authority-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.json .github/workflows/tmp-whitelist-human-authority-readme.yml
          git diff --cached --check
          git commit -m "docs(governance): index human-only whitelist authority"
          git push origin HEAD:governance/whitelist-human-only-authority-20260911
