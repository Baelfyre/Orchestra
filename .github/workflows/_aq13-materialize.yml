name: AQ13 Materialize Bootstrap

on:
  push:
    branches:
      - feat/aq13-staged-rollout-evaluation-20260911
    paths:
      - tools/_aq13_materializer.py
      - .github/workflows/_aq13-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AQ13 branch
        uses: actions/checkout@v4
        with:
          ref: feat/aq13-staged-rollout-evaluation-20260911
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize, validate, self-retire, and push
        run: python -B tools/_aq13_materializer.py
