name: Temporary O7.7 validator import bootstrap

on:
  push:
    branches:
      - feat/o7-7-joint-conformance-20260828
    paths:
      - ".github/workflows/_o7-7-import-bootstrap-tmp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/o7-7-joint-conformance-20260828
      - name: Add repository root to validator import path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/validate_registry_o7_joint_conformance.py")
          text = path.read_text(encoding="utf-8")
          old = '''from pathlib import Path\nfrom typing import Any, Mapping\n\nfrom orchestra_runtime import registry_adaptive, registry_o7\n'''
          new = '''from pathlib import Path\nfrom typing import Any, Mapping\n\nROOT = Path(__file__).resolve().parents[1]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\nfrom orchestra_runtime import registry_adaptive, registry_o7\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one validator import block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile scripts/validate_registry_o7_joint_conformance.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_registry_o7_joint_conformance.py
          git commit -m "fix(o7): bootstrap repository root for joint validator"
          git push origin HEAD:feat/o7-7-joint-conformance-20260828
