name: validate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: Run behavior validation suite
        run: python tests/behavior/run_tests.py

      - name: Test signed materialization contract
        run: python tests/behavior/test_signed_materialization.py

      - name: Test TrueSheet specialist machine reference
        run: python tests/behavior/test_truesheet_reference.py

  runtime-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov hypothesis==6.163.0

      - name: Prepare runtime evidence directory
        run: mkdir -p artifacts/runtime

      - name: Run runtime test suite with statement and branch measurement
        id: runtime
        continue-on-error: true
        run: >-
          python -m pytest tests/runtime
          --cov=orchestra_runtime
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:artifacts/runtime/coverage.json
          --junitxml=artifacts/runtime/runtime-junit.xml
          --cov-fail-under=0

      - name: Build machine-readable runtime test evidence
        id: evidence
        if: always()
        continue-on-error: true
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNTIME_TEST_OUTCOME: ${{ steps.runtime.outcome }}
        run: >-
          python -m orchestra_runtime.test_evidence
          --coverage artifacts/runtime/coverage.json
          --junit artifacts/runtime/runtime-junit.xml
          --output artifacts/runtime/test-evidence.json
          --minimum-statement-coverage 97
          --minimum-branch-coverage 95

      - name: Build and enforce machine-readable critical coverage inventory
        id: critical_coverage
        if: always()
        continue-on-error: true
        run: >-
          python scripts/validation/build_coverage_inventory.py
          --coverage artifacts/runtime/coverage.json
          --output artifacts/runtime/coverage-inventory.json
          --critical-statement-floor 98
          --critical-branch-floor 95

      - name: Upload runtime test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce runtime and evidence result
        if: always()
        shell: bash
        run: |
          test "${{ steps.runtime.outcome }}" = "success"
          test "${{ steps.evidence.outcome }}" = "success"
          test "${{ steps.critical_coverage.outcome }}" = "success"
