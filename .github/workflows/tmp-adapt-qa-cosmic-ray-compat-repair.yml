name: ADAPT-QA Cosmic Ray compatibility repair

on:
  push:
    branches:
      - gov/adapt-qa-phase-separation-framework-20260911

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: gov/adapt-qa-phase-separation-framework-20260911
          fetch-depth: 0

      - name: Apply bounded classifier repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validation/classify_adaptive_assurance_scope.py")
          text = path.read_text(encoding="utf-8")

          old_import = "import json\nimport sys\n"
          new_import = "import json\nimport sys\nfrom json import JSONDecodeError\n"
          old_except = "except (OSError, json.JSONDecodeError) as exc:"
          new_except = "except (OSError, JSONDecodeError) as exc:"

          if old_import not in text:
              raise SystemExit("expected import anchor missing")
          if old_except not in text:
              raise SystemExit("expected exception anchor missing")

          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_except, new_except, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validation/classify_adaptive_assurance_scope.py
          python tests/behavior/test_protected_aq8_assurance_scope_policy.py
          git diff --check

      - name: Retire helper and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-adapt-qa-cosmic-ray-compat-repair.yml
          git diff --check
          git add scripts/validation/classify_adaptive_assurance_scope.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(governance): make classifier mutation-compatible"
          git push origin HEAD:gov/adapt-qa-phase-separation-framework-20260911
