name: CUIR-4 permission-safe builder executor

on:
  push:
    branches:
      - feat/cloak-cuir4-pattern-intelligence

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloak-cuir4-pattern-intelligence
          fetch-depth: 0
      - name: Build durable CUIR-4 files
        shell: bash
        run: |
          if [ -f machine/knowledge/cloak-ui-pattern-intelligence-cuir4.v1.json ]; then
            echo "CUIR4_BUILDER=ALREADY_MATERIALIZED"
            exit 0
          fi
          python -m pip install pytest
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/cuir4-branch-build.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          git diff --check"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code_lines = []
          for line in workflow[start:end].splitlines():
              if line.startswith('          '):
                  line = line[10:]
              code_lines.append(line)
          code = '\n'.join(code_lines)
          code = code.replace("helper = Path('.github/workflows/cuir4-branch-build.yml')\nhelper.unlink()", "# helper retained for connector-side cleanup")
          exec(compile(code, '<cuir4-builder>', 'exec'), {})
          PY
          git diff --check
          python -m pytest tests/runtime/test_cloak_ui_reference_corpus_cuir4.py -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.json docs/project/CLOAK_UI_REFERENCE_CORPUS_CUIR4_INTEGRATION.md machine/knowledge/cloak-ui-pattern-intelligence-cuir4.v1.json machine/schemas/cloak-ui-pattern-intelligence-cuir4.v1.schema.json scripts/retrieve_cloak_patterns.py skills/cloak/SKILL.md skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md adapters/codex/skills/cloak/SKILL.md adapters/codex/skills/cloak/CUIR_PATTERN_INTELLIGENCE_GUIDE.md tests/runtime/test_cloak_ui_reference_corpus_cuir4.py
          git commit -m "feat(cuir4): integrate Cloak pattern intelligence"
          git push origin HEAD:feat/cloak-cuir4-pattern-intelligence
