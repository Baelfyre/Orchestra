""",
          )
          replace_regex(
              "docs/setup/COMPATIBILITY.md",
              r"^# Compatibility\n\n.*?(?=Scaffold-only hosts are not full support claims\.)",
              f"""# Compatibility

The current public GitHub Release is Orchestra `v1.7.0: Adaptive Intelligence, Portable Memory & Design Fidelity`, published from lightweight tag `v1.7.0` at exact GitHub-verified signed release commit `{RELEASE_SHA}`. The release is non-draft, non-prerelease, immutable, and independently verified as latest.

The `v1.7.0` tag resolves directly to the exact release commit. v1.7.0 retains the bounded MCP stdio transport and PRAP/Adapter SDK introduced in v1.6.0, while adding adaptive intelligence, storage-agnostic portable memory, Registry O1-O6 adaptive consumption, and governed UI design-fidelity contracts. Publication did not graduate scaffold-only hosts or publish those scaffold surfaces to marketplaces.

