name: Apply v1.7 post-release parity

on:
  push:
    branches:
      - docs/v1-7-post-release-parity-20260826

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'ops: apply v1.7 post-release parity')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: docs/v1-7-post-release-parity-20260826
          fetch-depth: 0

      - name: Reconcile current-facing documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          RELEASE_SHA = "e5305ef3e160209a0345bd2c7843c923940e62c5"
          RELEASE_TREE = "7b7a0f6d5dd5376a62125ed1c6b037284e519c69"
          RELEASE_PARENT = "664079b5fb9e149ea0689ff08bc2d9c039780290"
          RELEASE_ID = "376713145"
          VERIFY_RUN = "32898750932"
          V16_SHA = "ba35764a14111518c7da729b5a4c69c6af485a9b"
          V16_RELEASE_ID = "371748233"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              write(path, text.replace(old, new))

          def replace_regex(path, pattern, replacement, expected=1, flags=re.S):
              text = read(path)
              new_text, count = re.subn(pattern, replacement, text, count=expected, flags=flags)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} regex replacements, found {count}: {pattern!r}")
              write(path, new_text)

          # README: current published state and MCP wording.
          replace_regex(
              "README.md",
              r"## Current release state\n\n.*?(?=## Research and validation archive)",
              f"""## Current release state

The latest published release is **[v1.7.0: Adaptive Intelligence, Portable Memory & Design Fidelity](https://github.com/Baelfyre/Orchestra/releases/tag/v1.7.0)**. The immutable release resolves to canonical commit `{RELEASE_SHA}` with tree `{RELEASE_TREE}` and a GitHub verified/valid signature.

v1.7.0 consolidates adaptive intelligence through bounded shadow maturity, storage-agnostic portable adaptive memory, Registry O1-O6 adaptive consumption, governed UI design fidelity through UIX-9A proof preparation, and the post-v1.6 documentation/research closeout. The `v1.7.0` tag remains fixed even when `main` receives later post-release maintenance.

UIX-9A remains deterministic proof infrastructure only. No live UIX-9 model/provider proof was executed as part of v1.7.0, and no model-behavior benefit claim is established by the repository-only protocol.

""",
          )
          replace_exact(
              "README.md",
              "The v1.6 transport targets MCP protocol revision `2026-07-28` and exposes only `server/discover`, `tools/list`, and `tools/call`.",
              "The bounded MCP transport, introduced in v1.6.0 and retained in v1.7.0, targets protocol revision `2026-07-28` and exposes only `server/discover`, `tools/list`, and `tools/call`.",
          )

          # README.json: current machine-facing release projection.
          replace_exact("README.json", '"current_public_release": "v1.6.0"', '"current_public_release": "v1.7.0"', expected=2)
          replace_exact("README.json", f'"current_public_release_commit": "{V16_SHA}"', f'"current_public_release_commit": "{RELEASE_SHA}"')
          replace_exact("README.json", '"next_release_plan": "V1_7_RELEASE_CANDIDATE"', '"next_release_plan": "POST_V1_7_MAINTENANCE"')
          replace_exact("README.json", '"next_release_plan_status": "AUTHORIZED_PENDING_EXACT_HEAD_VALIDATION_AND_PUBLICATION"', '"next_release_plan_status": "V1_7_0_PUBLISHED_VERIFIED_COMPLETE"')
          replace_exact("README.json", f'"release_commit": "{V16_SHA}"', f'"release_commit": "{RELEASE_SHA}"')
          replace_exact("README.json", f'"release_evidence": "GITHUB_RELEASE_ID_{V16_RELEASE_ID}"', f'"release_evidence": "GITHUB_RELEASE_ID_{RELEASE_ID}"')
          replace_exact("README.json", f'"publication_closeout": "GITHUB_RELEASE_ID_{V16_RELEASE_ID}_PLUS_CANONICAL_COMMIT_VERIFICATION"', f'"publication_closeout": "GITHUB_RELEASE_ID_{RELEASE_ID}_PLUS_POST_PUBLICATION_VERIFICATION_RUN_{VERIFY_RUN}"')
          replace_exact("README.json", '"provisional_next_release": "v1.7.0"', '"provisional_next_release": "UNSET"')
          replace_exact("README.json", '"provisional_next_release_status": "AUTHORIZED_RELEASE_CANDIDATE_VALIDATION_IN_PROGRESS"', '"provisional_next_release_status": "NO_NEXT_RELEASE_DECLARED"')
          replace_exact("README.json", '"release_tracking_issue": 563,', '"release_tracking_issue": 563,\n    "release_tracking_issue_state": "CLOSED_COMPLETED",')
          replace_exact("README.json", '"publication_authorized": true', '"publication_authorized": false')
          replace_exact("README.json", '"publication_target": "v1.7.0_AFTER_EXACT_HEAD_VALIDATION"', '"publication_target": "PUBLISHED_V1_7_0_EXACT_IDENTITY_VERIFIED"')
          replace_exact("README.json", '"current_public_release": "PUBLISHED_VERIFIED_V1_6_0"', '"current_public_release": "PUBLISHED_VERIFIED_V1_7_0"')
          replace_exact("README.json", '"v1_7_release_candidate": "AUTHORIZED_PENDING_EXACT_HEAD_VALIDATION_AND_PUBLICATION"', '"v1_7_release_candidate": "PUBLISHED_VERIFIED_COMPLETE"')
          replace_exact(
              "README.json",
              '"release_candidate_v1_7_0": "docs/releases/v1.7.0-adaptive-intelligence-portable-memory-design-fidelity-release-candidate.md",',
              '"release_candidate_v1_7_0": "docs/releases/v1.7.0-adaptive-intelligence-portable-memory-design-fidelity-release-candidate.md",\n    "publication_closeout_v1_7_0": "docs/validation/V1_7_0_PUBLICATION_CLOSEOUT.md",',
          )

          # Project context: publication is complete, future publication needs fresh authority.
          replace_regex(
              "PROJECT_CONTEXT.md",
              r"## Current Stage\n.*?(?=\n## Primary Users)",
              f"""## Current Stage
v1.7.0 - Adaptive Intelligence, Portable Memory & Design Fidelity (`PUBLISHED_VERIFIED`). The immutable GitHub Release and lightweight `v1.7.0` tag resolve to canonical signed commit `{RELEASE_SHA}` with tree `{RELEASE_TREE}`. Post-publication verification run `{VERIFY_RUN}` independently confirmed tag target, release body, immutable/latest state, canonical SHA/tree/parent/signature, and preservation of the prior v1.6.0 tag. Later commits on `main` are post-release maintenance and do not move the v1.7.0 release identity.""",
          )
          replace_exact(
              "PROJECT_CONTEXT.md",
              "- UIX-9A is deterministic repository proof preparation only. No live UIX-9 provider/model execution or model-behavior benefit claim is included in the v1.7 release candidate.",
              "- UIX-9A is deterministic repository proof preparation only. No live UIX-9 provider/model execution or model-behavior benefit claim is included in the published v1.7.0 release.",
