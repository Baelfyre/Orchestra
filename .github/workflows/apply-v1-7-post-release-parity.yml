- **Release Status:** `v1.7.0 PUBLISHED_VERIFIED`
- **Target Release:** `NONE_DECLARED`
- **Release-Candidate Metadata:** `1.7.0` (`PUBLISHED`)
- **v1.2.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.3.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.4.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.5.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.6.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.6.0 Release Commit:** `{V16_SHA}`
- **v1.6.0 GitHub Release:** id `{V16_RELEASE_ID}`, immutable, non-draft, non-prerelease, historical after v1.7.0 publication
- **v1.7.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.7.0 Release Commit:** `{RELEASE_SHA}`
- **v1.7.0 Release Tree:** `{RELEASE_TREE}`
- **v1.7.0 Sole Parent:** `{RELEASE_PARENT}`
- **v1.7.0 Tag Ref:** lightweight `commit` ref targeting the exact release commit
- **v1.7.0 GitHub Release:** id `{RELEASE_ID}`, immutable, non-draft, non-prerelease, independently verified latest
- **v1.7.0 Post-Publication Verification:** run `{VERIFY_RUN}` PASS
- **Control Plane State:** `V1_7_0_CURRENT`
- **MCP State:** `PUBLISHED_V1_6_STABLE_RETAINED_V1_7`
- **Policy Activation State:** `NOT_PERFORMED`
"""
          replace_regex(
              "PROJECT_STATE.md",
              r"- \*\*Current Public Release:\*\*.*?- \*\*Policy Activation State:\*\*.*?\n",
              current_state_block,
          )
          replace_exact("PROJECT_STATE.md", '- **Active Repo:** `D:\\Dev\\Repositories\\+conductor`', '- **Active Repo:** `Baelfyre/Orchestra`')
          replace_exact(
              "PROJECT_STATE.md",
              "## v1.5.0 Machine-Verifiable Control Plane and Murmurs Publication",
              f"""## v1.7.0 Adaptive Intelligence, Portable Memory & Design Fidelity Publication

Orchestra `v1.7.0` is `PUBLISHED_VERIFIED`. Immutable GitHub Release id `{RELEASE_ID}` and lightweight tag `v1.7.0` resolve to exact signed canonical release commit `{RELEASE_SHA}` with tree `{RELEASE_TREE}` and sole parent `{RELEASE_PARENT}`. Canonical Governance, validate/runtime, Required Analysis Compatibility/CodeQL, native Windows/Ubuntu/macOS validation, Cosmic Ray confidence, signed materialization, expected-head Squash, and zero unresolved review-thread gates passed before publication. Read-only post-publication verification run `{VERIFY_RUN}` independently confirmed the exact tag, release body, latest/immutable release state, and prior-tag preservation.

The release includes governed adaptive intelligence through bounded shadow maturity, optional storage-agnostic portable adaptive memory, Registry O1-O6 adaptive consumption, and governed UI design fidelity through UIX-9A repository proof preparation. A5 topology benefit and repeatable Murmurs efficiency benefit were not established, so neither was promoted to default execution authority.

No live UIX-9 model/provider proof, deployment, production mutation, policy activation, installed-integration refresh, destructive cleanup, force push, or history rewrite was performed. Later `main` changes are post-release maintenance and do not move the immutable v1.7.0 identity.

See `docs/validation/V1_7_0_PUBLICATION_CLOSEOUT.md`.

## v1.5.0 Machine-Verifiable Control Plane and Murmurs Publication""",
          )

          handoff_block = f"""- **Current Public Release:** `v1.7.0`
- **Release-Candidate Metadata:** `v1.7.0` (`PUBLISHED`)
- **Target Release:** `NONE_DECLARED`
- **v1.2.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.3.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.4.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.5.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.6.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.6.0 Release Commit:** `{V16_SHA}`
- **v1.6.0 GitHub Release:** id `{V16_RELEASE_ID}`, immutable and historical after v1.7.0
- **v1.7.0 Release State:** `PUBLISHED_VERIFIED`
- **v1.7.0 Release Commit:** `{RELEASE_SHA}`
- **v1.7.0 Release Tree:** `{RELEASE_TREE}`
- **v1.7.0 Tag Ref:** lightweight `commit` ref targeting the exact release commit
- **v1.7.0 GitHub Release:** id `{RELEASE_ID}`, immutable, non-draft, non-prerelease, independently verified latest
