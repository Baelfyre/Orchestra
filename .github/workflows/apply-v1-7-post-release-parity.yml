name: Apply v1.7 post-release parity

on:
  push:
    branches:
      - docs/v1-7-post-release-parity-20260826

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'ops: run v1.7 parity patch'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: docs/v1-7-post-release-parity-20260826
          fetch-depth: 0

      - name: Correct validated source expectation
        shell: bash
        run: sed -i 's/^    expected=2,$/    expected=1,/' scripts/_apply_v1_7_post_release_parity.py

      - name: Apply bounded parity patch
        run: python scripts/_apply_v1_7_post_release_parity.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool README.json > /dev/null
          git diff --check
          grep -Fq 'v1.7.0' README.md
          grep -Fq 'PUBLISHED_VERIFIED_V1_7_0' README.json
          grep -Fq 'requirements-dev.txt' docs/setup/VALIDATION.md
          grep -Fq 'Compatibility CodeQL (python)' docs/CONTRIBUTING.md
          grep -Fq 'PUBLISHED_VERIFIED_COMPLETE' docs/validation/V1_7_0_PUBLICATION_CLOSEOUT.md

      - name: Commit final review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/_apply_v1_7_post_release_parity.py .github/workflows/apply-v1-7-post-release-parity.yml
          git add README.md README.json PROJECT_CONTEXT.md PROJECT_STATE.md SESSION_HANDOFF.md CHANGELOG.md requirements-dev.txt docs/README.md docs/MATURITY.md docs/CONTRIBUTING.md docs/setup/INSTALLATION.md docs/setup/COMPATIBILITY.md docs/setup/HOST_UPDATES.md docs/setup/ADAPTER_SDK_PRAP.md docs/setup/VALIDATION.md docs/developer/README.md docs/developer/MCP_STDIO_TRANSPORT.md docs/validation/V1_7_0_PUBLICATION_CLOSEOUT.md
          git commit -m "docs: reconcile v1.7 post-release parity"
          git push origin HEAD:docs/v1-7-post-release-parity-20260826
