- **MCP State:** `PUBLISHED_V1_6_STABLE_RETAINED_V1_7`
- **Policy Activation:** `NOT_PERFORMED`
"""
          replace_regex(
              "SESSION_HANDOFF.md",
              r"- \*\*Current Public Release:\*\*.*?- \*\*Policy Activation:\*\*.*?\n",
              handoff_block,
          )
          replace_exact(
              "SESSION_HANDOFF.md",
              "## v1.5.0 Machine-Verifiable Control Plane and Murmurs Publication Continuity",
              f"""## v1.7.0 Adaptive Intelligence, Portable Memory & Design Fidelity Publication Continuity

Orchestra `v1.7.0` is `PUBLISHED_VERIFIED`. Release id `{RELEASE_ID}` and lightweight tag `v1.7.0` resolve to exact signed canonical commit `{RELEASE_SHA}` with tree `{RELEASE_TREE}`. The complete exact-head release matrix and signed-materialization path passed before publication. Post-publication verification run `{VERIFY_RUN}` then independently confirmed the exact immutable/latest release identity and preserved the prior `v1.6.0` tag.

The v1.7.0 line adds bounded adaptive intelligence, user-selected portable memory transport, Registry O1-O6 adaptive consumption, and UIX design-fidelity contracts through UIX-9A proof preparation. Live UIX-9 provider/model proof remains not run, and negative/inconclusive A5 and Murmurs results remain non-promoted.

Evidence: `docs/validation/V1_7_0_PUBLICATION_CLOSEOUT.md`.

## v1.5.0 Machine-Verifiable Control Plane and Murmurs Publication Continuity""",
          )

          # Installation and compatibility release-state parity.
          replace_regex(
              "docs/setup/INSTALLATION.md",
              r"## Release Status\n\n.*?(?=\| Host \| Install Surface)",
              f"""## Release Status

The current public GitHub Release is `v1.7.0: Adaptive Intelligence, Portable Memory & Design Fidelity`, published from lightweight tag `v1.7.0` at exact GitHub-verified signed release commit `{RELEASE_SHA}`. The release is non-draft, non-prerelease, immutable, and independently verified as latest.

