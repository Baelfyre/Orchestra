name: Temporary post-v1.11 documentation scope release-test parity repair

on:
  push:
    branches:
      - "gov/post-v1.11-docs-normalization-scope-20260911"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependency
        run: python -m pip install pytest

      - name: Expand test inventory and prove fail-closed before classifier update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/behavior/test_governance_post_publication_docs_scope.py')
          text = p.read_text(encoding='utf-8')
          anchor = '    "docs/setup/INSTALLATION.md",\n'
          addition = '    "tests/runtime/test_uai10_maturity_closeout.py",\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('test inventory insertion anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
          if python -m pytest -q tests/behavior/test_governance_post_publication_docs_scope.py; then
            echo "Expanded docs+release-test inventory unexpectedly passed before classifier update."
            exit 1
          fi

      - name: Expand exact protected inventory and clarify policy prose
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          classifier = Path('scripts/validation/classify_adaptive_assurance_scope.py')
          text = classifier.read_text(encoding='utf-8')
          marker = 'POST_PUBLICATION_DOCUMENTATION_NORMALIZATION_PATHS = frozenset('
          start = text.index(marker)
          end = text.index('\n)\n\nIMPLEMENTATION_PATHS_BY_GATE', start)
          block = text[start:end]
          anchor = '        "docs/setup/INSTALLATION.md",\n'
          addition = '        "tests/runtime/test_uai10_maturity_closeout.py",\n'
          if addition not in block:
              if anchor not in block:
                  raise SystemExit('classifier inventory insertion anchor missing')
              block = block.replace(anchor, anchor + addition, 1)
              text = text[:start] + block + text[end:]
          text = text.replace(
              '# Only the complete registered v1.11 public-state documentation inventory is\n',
              '# Only the complete registered v1.11 public-state documentation inventory plus\n# its single current-release parity assertion is\n',
              1,
          )
          classifier.write_text(text, encoding='utf-8')

          policy = Path('docs/governance/POST_V1_11_DOCUMENTATION_NORMALIZATION_SCOPE_POLICY.md')
          ptext = policy.read_text(encoding='utf-8')
          ptext = ptext.replace(
              'one deterministic exact-set assurance-scope lane for the post-publication normalization of Orchestra v1.11.0 documentation.',
              'one deterministic exact-set assurance-scope lane for the post-publication normalization of Orchestra v1.11.0 documentation plus the single runtime test assertion that binds the machine README current-public-release value.',
          )
          ptext = ptext.replace(
              'exactly the registered documentation inventory enforced by `scripts/validation/classify_adaptive_assurance_scope.py`.',
              'exactly the registered documentation inventory plus `tests/runtime/test_uai10_maturity_closeout.py`, limited there to the corresponding current-public-release assertion, as enforced by `scripts/validation/classify_adaptive_assurance_scope.py`.',
          )
          policy.write_text(ptext, encoding='utf-8')

          readme = Path('README.json')
          doc = json.loads(readme.read_text(encoding='utf-8'))
          cap = doc['capabilities']['post_publication_documentation_normalization_scope']
          cap['purpose'] = 'Permit only the exact v1.11 post-publication documentation normalization inventory plus its current-release parity assertion to bypass historical AQ5/AQ7/PRAI implementation-scope matching while preserving all ordinary repository validation.'
          cap['scope_rule'] = 'EXACT_SET_ONLY_DOCS_PLUS_SINGLE_RELEASE_STATE_PARITY_TEST_FAIL_CLOSED_PARTIAL_MIXED_SUPERSET'
          readme.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          ctext = changelog.read_text(encoding='utf-8')
          old = '- Historical PRAI/AQ5/AQ7 implementation inventories are `NOT_APPLICABLE` only for the complete registered documentation set.\n'
          new = '- Historical PRAI/AQ5/AQ7 implementation inventories are `NOT_APPLICABLE` only for the complete registered documentation set plus the one current-release parity assertion that reads `README.json`.\n'
          if old in ctext:
              ctext = ctext.replace(old, new, 1)
          elif new not in ctext:
              raise SystemExit('changelog scope line missing')
          changelog.write_text(ctext, encoding='utf-8')
          PY

      - name: Run repaired Gate 0 and prior scope regressions
        run: |
          python -m pytest -q tests/behavior/test_governance_post_publication_docs_scope.py
          python -m pytest -q tests/behavior/test_governance_release_packaging_assurance_scope.py

      - name: Commit repair and self-retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-post-v1.11-docs-scope-test-parity-repair.yml
          git add scripts/validation/classify_adaptive_assurance_scope.py \
                  tests/behavior/test_governance_post_publication_docs_scope.py \
                  docs/governance/POST_V1_11_DOCUMENTATION_NORMALIZATION_SCOPE_POLICY.md \
                  README.json CHANGELOG.md
          git commit -m "fix(governance): bind v1.11 docs scope to release-state parity test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
